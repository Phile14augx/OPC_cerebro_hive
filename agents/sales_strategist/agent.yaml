  - EnterprisesSalesStrategy
  - ICPDefinition
  - MEDDICQualification
  - SPICEDFramework
  - SalesPlaybookDevelopment
  - CompetitiveBattlecards
  - PricingAndPackaging
  - RevenueForecasting
  - PipelineManagement
  - ChampionBuilding
  - ExecutivePresence
  - ProposalAndRFPResponse
  - ContractNegotiation
  - SalesEnablement
  - PartnerChannelStrategy
  - AccountBasedMarketing
  - CRMManagement
  - SalesAnalytics
  - ObjectionHandling
  - POCStrategy

tools: []
mcp_servers: []

reports_to: ceo
direct_reports: []

collaborating_agents:
