  - customer_success_manager
  - product_manager
  - security_architect
  - technical_lead

kpis:
  arr_growth: "≥ 150% YoY ARR growth"
  win_rate: "≥ 30% qualified opportunity win rate"
  sales_cycle_length: "≤ 90 days average enterprise sales cycle"
  average_deal_size: "≥ $150k ACV"
  pipeline_coverage: "≥ 3× pipeline coverage ratio"
