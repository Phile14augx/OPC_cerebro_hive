name: CleanupOps — Delete Failed Workflow Runs

# ──────────────────────────────────────────────────────────────────────────────
# Run Cleanup — fires whenever ANY workflow in this repo completes successfully.
# Deletes all failed, cancelled, and skipped runs for that same workflow + branch,
# leaving only the successful runs in history.
#
# Result: GitHub Actions tab shows only green runs. All the failed attempts,
# heal cycles, and retry noise are automatically purged on success.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows:
      - "CI"
      - "DockerOps — Build & Push Images"
      - "ReleaseOps — Release Train"
      - "HealOps — Self-Healing CI"
      - "DeployOps — Auto-Retry Watchdog"
      - "DeployOps — ArgoCD Sync Retry Loop"
      - "PolicyOps — Policy Gate"
      - "SecurityOps — CodeQL"
      - "LighthouseCI"
      - "LoadTest"
      - "LLMOps — Eval Gate"
    types:
      - completed

  # Manual cleanup — nuke failed runs for a specific workflow or branch
  workflow_dispatch:
    inputs:
      workflow_name:
        description: "Workflow filename to clean (e.g. ci.yml) — leave empty for all"
        required: false
        default: ""
      branch:
        description: "Branch to clean — leave empty for current default branch"
        required: false
        default: ""
      dry_run:
        description: "Dry run — list what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  actions: write   # delete workflow runs


defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  cleanup:
    name: "Purge failed runs — ${{ github.event.workflow_run.name || inputs.workflow_name || 'all' }}"
    runs-on: ubuntu-latest
    # Only run when the triggering workflow actually succeeded
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Delete failed runs for completed workflow
        uses: actions/github-script@v7
        with:
          script: |
            const isDryRun = '${{ inputs.dry_run }}' === 'true';

            // Resolve which workflow + branch to clean
            let workflowId, branch;

            if (context.eventName === 'workflow_run') {
              // Triggered by a successful run — clean that exact workflow + branch
              workflowId = context.payload.workflow_run.workflow_id;
              branch     = context.payload.workflow_run.head_branch;
              console.log(`Triggered by: "${context.payload.workflow_run.name}" succeeded on ${branch}`);
            } else {
              // Manual dispatch
              branch = '${{ inputs.branch }}' || context.payload.repository.default_branch;

              if ('${{ inputs.workflow_name }}') {
                // Look up workflow ID by filename
                const { data: workflows } = await github.rest.actions.listRepoWorkflows({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                });
                const match = workflows.workflows.find(
                  w => w.path.endsWith('${{ inputs.workflow_name }}')
                );
                if (!match) {
                  core.setFailed(`Workflow "${{ inputs.workflow_name }}" not found`);
                  return;
                }
                workflowId = match.id;
              }
            }

            // Statuses to delete — everything that isn't a clean success
            const DELETE_CONCLUSIONS = new Set([
              'failure',
              'cancelled',
              'timed_out',
              'action_required',
              'skipped',
            ]);

            let totalDeleted = 0;
            let totalSkipped = 0;

            // Helper: fetch and purge runs for one workflow
            async function cleanWorkflow(wfId, wfName) {
              let page = 1;
              let deleted = 0;
              let skipped = 0;

              while (true) {
                const params = {
                  owner:    context.repo.owner,
                  repo:     context.repo.repo,
                  workflow_id: wfId,
                  per_page: 100,
                  page,
                };
                if (branch) params.branch = branch;

                const { data } = await github.rest.actions.listWorkflowRuns(params);
                if (data.workflow_runs.length === 0) break;

                for (const run of data.workflow_runs) {
                  // Never delete in-progress or queued runs
                  if (run.status !== 'completed') {
                    skipped++;
                    continue;
                  }

                  // Keep successful runs
                  if (!DELETE_CONCLUSIONS.has(run.conclusion)) {
                    skipped++;
                    continue;
                  }

                  if (isDryRun) {
                    console.log(`[DRY RUN] Would delete: ${wfName} run #${run.run_number} (${run.conclusion}) @ ${run.head_sha.slice(0,7)} ${new Date(run.created_at).toISOString()}`);
                    deleted++;
                    continue;
                  }

                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner:  context.repo.owner,
                      repo:   context.repo.repo,
                      run_id: run.id,
                    });
                    console.log(`🗑️  Deleted: ${wfName} #${run.run_number} (${run.conclusion}) @ ${run.head_sha.slice(0,7)}`);
                    deleted++;

                    // Small delay to avoid secondary rate limits
                    await new Promise(r => setTimeout(r, 100));
                  } catch (err) {
                    console.log(`⚠️  Could not delete run ${run.id}: ${err.message}`);
                  }
                }

                if (data.workflow_runs.length < 100) break;
                page++;
              }

              return { deleted, skipped };
            }

            if (workflowId) {
              // Single workflow mode
              const wfName = context.eventName === 'workflow_run'
                ? context.payload.workflow_run.name
                : '${{ inputs.workflow_name }}';
              const result = await cleanWorkflow(workflowId, wfName);
              totalDeleted += result.deleted;
              totalSkipped += result.skipped;
            } else {
              // All-workflows mode (manual dispatch with no workflow specified)
              const { data: allWorkflows } = await github.rest.actions.listRepoWorkflows({
                owner: context.repo.owner,
                repo:  context.repo.repo,
              });
              for (const wf of allWorkflows.workflows) {
                console.log(`\n── Cleaning: ${wf.name} ──`);
                const result = await cleanWorkflow(wf.id, wf.name);
                totalDeleted += result.deleted;
                totalSkipped += result.skipped;
              }
            }

            // ── Self-cleanup: delete old CleanupOps runs (except this one) ──
            if (!isDryRun) {
              const { data: selfWfs } = await github.rest.actions.listRepoWorkflows({
                owner: context.repo.owner,
                repo:  context.repo.repo,
              });
              const selfWf = selfWfs.workflows.find(w => w.path.endsWith('cleanup-runs.yml'));
              if (selfWf) {
                let selfPage = 1;
                while (true) {
                  const { data: selfRuns } = await github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner,
                    repo:  context.repo.repo,
                    workflow_id: selfWf.id,
                    per_page: 100,
                    page: selfPage,
                  });
                  if (!selfRuns.workflow_runs.length) break;
                  for (const run of selfRuns.workflow_runs) {
                    if (run.id === context.runId)      continue; // never delete self
                    if (run.status !== 'completed')     continue;
                    if (!DELETE_CONCLUSIONS.has(run.conclusion)) continue;
                    try {
                      await github.rest.actions.deleteWorkflowRun({
                        owner: context.repo.owner, repo: context.repo.repo, run_id: run.id,
                      });
                      console.log(`🗑️  Self-deleted CleanupOps #${run.run_number} (${run.conclusion})`);
                      totalDeleted++;
                      await new Promise(r => setTimeout(r, 80));
                    } catch (e) { /* ignore */ }
                  }
                  if (selfRuns.workflow_runs.length < 100) break;
                  selfPage++;
                }
              }
            }

            // Summary
            const action = isDryRun ? 'Would delete' : 'Deleted';
            console.log(`\n✅ Cleanup complete`);
            console.log(`   ${action}: ${totalDeleted} failed/cancelled runs`);
            console.log(`   Kept:    ${totalSkipped} successful/in-progress runs`);

            // Write step summary
            core.summary
              .addHeading('🗑️ CleanupOps — Run Purge', 2)
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Mode',    isDryRun ? '🔍 Dry run' : '🗑️ Live delete'],
                ['Branch',  branch || '(all branches)'],
                [action,    `${totalDeleted} runs`],
                ['Kept',    `${totalSkipped} runs`],
              ])
              .write();
