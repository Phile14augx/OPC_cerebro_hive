name: Governance Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  governance-gate:
    name: governance-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: OPC/cerebro-hive-website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify governance workflow contract
        run: pnpm governance:contract
