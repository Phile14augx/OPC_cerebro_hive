name: DeployOps — Auto-Retry Watchdog

# ──────────────────────────────────────────────────────────────────────────────
# Deployment Watchdog — Intelligent Retry Coordinator
#
# Routes failures to the right handler:
#   CI failures        → HealOps self-healer (analyzes + fixes + recommits)
#   Docker failures    → re-trigger with no-cache flag
#   Release failures   → exponential backoff retry + incident issue
#
# The self-healer (self-heal.yml) handles code-level fixes.
# This watchdog handles infrastructure-level retries.
# ──────────────────────────────────────────────────────────────────────────────

on:
  # Trigger when any workflow in this repo fails
  workflow_run:
    workflows:
      - "CI"
      - "DockerOps — Build & Push Images"
      - "ReleaseOps — Release Train"
      - "HealOps — Self-Healing CI"      # watch healer output too
    types:
      - completed

  # Also allow manual trigger for emergency re-runs
  workflow_dispatch:
    inputs:
      workflow_id:
        description: "Workflow run ID to retry"
        required: true
      attempt_number:
        description: "Which retry attempt this is (1-4)"
        required: false
        default: "1"

permissions:
  actions: write      # re-trigger workflows
  contents: read
  issues: write       # open incident issues on permanent failure

env:
  MAX_RETRIES: "4"


defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  watchdog:
    name: Watchdog — Evaluate & Retry
    runs-on: ubuntu-latest
    # Only act on failures (not cancellations or successes)
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Resolve failed run metadata
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            let runId, runName, runNumber, headSha, headBranch, attempt;

            if (context.eventName === 'workflow_dispatch') {
              runId     = parseInt(core.getInput('workflow_id') || '${{ inputs.workflow_id }}');
              attempt   = parseInt('${{ inputs.attempt_number }}' || '1');
              const run = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                run_id: runId,
              });
              runName   = run.data.name;
              runNumber = run.data.run_number;
              headSha   = run.data.head_sha;
              headBranch = run.data.head_branch;
            } else {
              runId      = context.payload.workflow_run.id;
              runName    = context.payload.workflow_run.name;
              runNumber  = context.payload.workflow_run.run_number;
              headSha    = context.payload.workflow_run.head_sha;
              headBranch = context.payload.workflow_run.head_branch;
              attempt    = context.payload.workflow_run.run_attempt;
            }

            core.setOutput('run_id',      runId);
            core.setOutput('run_name',    runName);
            core.setOutput('run_number',  runNumber);
            core.setOutput('head_sha',    headSha);
            core.setOutput('head_branch', headBranch);
            core.setOutput('attempt',     attempt);
            core.setOutput('should_retry', attempt < parseInt(process.env.MAX_RETRIES) ? 'true' : 'false');

            console.log(`Watchdog: "${runName}" #${runNumber} failed on attempt ${attempt}/${process.env.MAX_RETRIES}`);

      # ── Route to the right handler ─────────────────────────────────────────
      - name: Route failure to correct handler
        id: route
        if: steps.meta.outputs.should_retry == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runName  = '${{ steps.meta.outputs.run_name }}';
            const attempt  = parseInt('${{ steps.meta.outputs.attempt }}');

            // CI failures → self-healer (analyzes logs + fixes code)
            if (runName.includes('CI') && !runName.includes('HealOps')) {
              core.setOutput('handler', 'self-heal');
            }
            // Docker build failures → no-cache retry
            else if (runName.includes('DockerOps')) {
              core.setOutput('handler', 'docker-retry');
            }
            // HealBot itself failed → blind retry (healer can't fix itself)
            else if (runName.includes('HealOps')) {
              core.setOutput('handler', 'blind-retry');
            }
            // Everything else → blind retry with backoff
            else {
              core.setOutput('handler', 'blind-retry');
            }

      # ── Handler: self-heal (CI failures) ───────────────────────────────────
      - name: "Handler: dispatch self-healer for CI failure"
        if: steps.route.outputs.handler == 'self-heal'
        uses: actions/github-script@v7
        with:
          script: |
            const runId  = '${{ steps.meta.outputs.run_id }}';
            const branch = '${{ steps.meta.outputs.head_branch }}';
            const cycle  = parseInt('${{ steps.meta.outputs.attempt }}');

            console.log(`Dispatching HealOps self-healer (cycle ${cycle}) for CI run ${runId} on ${branch}`);

            await github.rest.actions.createWorkflowDispatch({
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              workflow_id: 'self-heal.yml',
              ref:      branch,
              inputs: {
                failed_run_id:  runId.toString(),
                cycle:          cycle.toString(),
                branch:         branch,
              },
            });
            console.log(`✅ HealOps dispatched for cycle ${cycle}`);

      # ── Handler: blind-retry (backoff + re-run) ─────────────────────────────
      - name: "Handler: exponential backoff delay"
        if: steps.route.outputs.handler == 'blind-retry'
        run: |
          ATTEMPT=${{ steps.meta.outputs.attempt }}
          DELAY=$(( (ATTEMPT - 1) * (ATTEMPT - 1) * 30 ))
          echo "Attempt ${ATTEMPT}: waiting ${DELAY}s..."
          [ "$DELAY" -gt 0 ] && sleep "$DELAY" || true

      - name: "Handler: re-run failed jobs"
        if: steps.route.outputs.handler == 'blind-retry'
        uses: actions/github-script@v7
        with:
          script: |
            const runId  = parseInt('${{ steps.meta.outputs.run_id }}');
            const runName = '${{ steps.meta.outputs.run_name }}';
            try {
              await github.rest.actions.reRunWorkflowFailedJobs({
                owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
              });
              console.log(`✅ Re-triggered failed jobs for "${runName}" run ${runId}`);
            } catch (err) {
              await github.rest.actions.reRunWorkflow({
                owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
              });
            }

      # ── Handler: docker no-cache retry ─────────────────────────────────────
      - name: "Handler: re-trigger Docker build with no-cache"
        if: steps.route.outputs.handler == 'docker-retry'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.meta.outputs.head_branch }}';
            // Trigger docker-build with no-cache flag via workflow_dispatch
            await github.rest.actions.createWorkflowDispatch({
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              workflow_id: 'docker-build.yml',
              ref:      branch,
              inputs:   { push: 'true' },
            });
            console.log(`✅ Re-triggered DockerOps on ${branch}`);

      # ── Notify on retry ────────────────────────────────────────────────────
      - name: Notify retry in progress
        if: steps.meta.outputs.should_retry == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const attempt  = parseInt('${{ steps.meta.outputs.attempt }}');
            const runName  = '${{ steps.meta.outputs.run_name }}';
            const runNumber = '${{ steps.meta.outputs.run_number }}';
            const headSha   = '${{ steps.meta.outputs.head_sha }}'.slice(0, 7);
            const maxRetries = parseInt(process.env.MAX_RETRIES);

            // Post to commit status
            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         '${{ steps.meta.outputs.head_sha }}',
              state:       'pending',
              context:     `watchdog/${runName}`,
              description: `Auto-retrying (attempt ${attempt + 1}/${maxRetries})`,
              target_url:  `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ steps.meta.outputs.run_id }}`,
            });

            console.log(`🔄 Retry ${attempt + 1}/${maxRetries} in progress for "${runName}" #${runNumber} @ ${headSha}`);

      # ── Dead-letter: open incident issue on final failure ──────────────────
      - name: Open incident issue (max retries exceeded)
        if: steps.meta.outputs.should_retry == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const runName   = '${{ steps.meta.outputs.run_name }}';
            const runNumber = '${{ steps.meta.outputs.run_number }}';
            const runId     = '${{ steps.meta.outputs.run_id }}';
            const headSha   = '${{ steps.meta.outputs.head_sha }}';
            const headBranch = '${{ steps.meta.outputs.head_branch }}';
            const runUrl    = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            // Check if an open incident issue already exists for this run
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'deployment-incident',
              state: 'open',
            });

            const existingIssue = issues.find(i => i.title.includes(runId.toString()));
            if (existingIssue) {
              console.log(`Incident issue already open: #${existingIssue.number}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 [Incident] "${runName}" failed after ${process.env.MAX_RETRIES} retries — Run #${runNumber}`,
              labels: ['deployment-incident', 'needs-human', 'high-priority'],
              body: `## Deployment Watchdog — Max Retries Exceeded

            **Workflow:** ${runName}
            **Run:** [#${runNumber}](${runUrl})
            **Branch:** \`${headBranch}\`
            **SHA:** \`${headSha.slice(0, 7)}\`
            **Retries:** ${process.env.MAX_RETRIES} attempts all failed

            ## What happened
            The deployment watchdog automatically retried the failed workflow ${process.env.MAX_RETRIES} times with exponential backoff. All attempts failed. Human intervention is required.

            ## Immediate actions
            - [ ] Check the [failed workflow run](${runUrl}) for root cause
            - [ ] Check service health in [Grafana](https://grafana.cerebrohive.com)
            - [ ] Check ArgoCD at [argocd.cerebrohive.com](https://argocd.cerebrohive.com)
            - [ ] If safe to do so, manually rerun: \`gh run rerun ${runId} --failed\`
            - [ ] If production is degraded, initiate rollback: \`argocd app rollback cerebro-hive-production\`
            - [ ] Close this issue once resolved

            ## Rollback commands
            \`\`\`bash
            # Rollback to previous release
            argocd app rollback cerebro-hive-production
            argocd app rollback cerebro-hive-staging

            # Or pin to last known good image tag
            argocd app set cerebro-hive-production \\
              -p studio.image.tag=<last-good-version> \\
              -p forge.image.tag=<last-good-version>
            \`\`\`

            ---
            *Auto-generated by [deploy-watchdog](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/deploy-watchdog.yml)*`,
            });

            // Set commit status to failure
            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         headSha,
              state:       'failure',
              context:     `watchdog/${runName}`,
              description: `Failed after ${process.env.MAX_RETRIES} retries — see issue #${issue.number}`,
              target_url:  issue.html_url,
            });

            core.setFailed(`Watchdog: max retries exceeded. Opened incident issue #${issue.number}`);
