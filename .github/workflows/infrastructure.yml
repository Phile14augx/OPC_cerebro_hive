name: Infrastructure

# ──────────────────────────────────────────────────────────────────────────────
# CerebroHive — Terraform Infrastructure Pipeline
#
# Plan on PR, Apply on merge to main / manual dispatch for production.
# State stored in S3 + DynamoDB lock table per environment.
# ──────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - "OPC/cerebro-hive-website/infra/terraform/**"
      - ".github/workflows/infrastructure.yml"
    branches: [main, develop]
  push:
    paths:
      - "OPC/cerebro-hive-website/infra/terraform/**"
      - ".github/workflows/infrastructure.yml"
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, production]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  security-events: write

env:
  TF_VERSION: "1.8.5"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  detect-changes:
    name: Detect Environment Changes
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.changes.outputs.dev }}
      staging: ${{ steps.changes.outputs.staging }}
      production: ${{ steps.changes.outputs.production }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            dev:
              - 'OPC/cerebro-hive-website/infra/terraform/environments/dev/**'
              - 'OPC/cerebro-hive-website/infra/terraform/modules/**'
            staging:
              - 'OPC/cerebro-hive-website/infra/terraform/environments/staging/**'
              - 'OPC/cerebro-hive-website/infra/terraform/modules/**'
            production:
              - 'OPC/cerebro-hive-website/infra/terraform/environments/production/**'
              - 'OPC/cerebro-hive-website/infra/terraform/modules/**'

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/terraform/
        continue-on-error: true

      - name: Terraform validate — ${{ matrix.environment }}
        working-directory: OPC/cerebro-hive-website/infra/terraform/environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false
          terraform validate

  plan:
    name: Plan — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            changed: ${{ needs.detect-changes.outputs.dev }}
            role_secret: AWS_DEV_ROLE_ARN
          - environment: staging
            changed: ${{ needs.detect-changes.outputs.staging }}
            role_secret: AWS_STAGING_ROLE_ARN
          - environment: production
            changed: ${{ needs.detect-changes.outputs.production }}
            role_secret: AWS_PROD_ROLE_ARN
    steps:
      - uses: actions/checkout@v7
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'

      - name: Configure AWS OIDC credentials
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[matrix.role_secret] }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: OPC/cerebro-hive-website/infra/terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Plan
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: plan
        working-directory: OPC/cerebro-hive-website/infra/terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan \
            -out=tfplan-${{ matrix.environment }} \
            -var-file=terraform.tfvars \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload plan artifact
        if: steps.plan.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ matrix.environment }}
          path: OPC/cerebro-hive-website/infra/terraform/environments/${{ matrix.environment }}/tfplan-${{ matrix.environment }}
          retention-days: 7

      - name: Post plan to PR
        if: github.event_name == 'pull_request' && matrix.changed == 'true'
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = 'OPC/cerebro-hive-website/infra/terraform/environments/${{ matrix.environment }}/plan-output.txt';
            let planOutput = '';
            try {
              planOutput = fs.readFileSync(path, 'utf8');
            } catch(e) {
              planOutput = 'Plan output not available.';
            }
            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n\n[... truncated ...]'
              : planOutput;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🏗️ Terraform Plan — \`${{ matrix.environment }}\`\n\n<details><summary>Show Plan</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n</details>`
            });

  apply:
    name: Apply — ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    needs: [validate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "name=dev" >> $GITHUB_OUTPUT
          fi

      - name: Select AWS role secret
        id: role
        run: |
          case "${{ steps.env.outputs.name }}" in
            dev) echo "secret=AWS_DEV_ROLE_ARN" >> "$GITHUB_OUTPUT" ;;
            staging) echo "secret=AWS_STAGING_ROLE_ARN" >> "$GITHUB_OUTPUT" ;;
            production) echo "secret=AWS_PROD_ROLE_ARN" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported environment" >&2; exit 1 ;;
          esac

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[steps.role.outputs.secret] }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: OPC/cerebro-hive-website/infra/terraform/environments/${{ steps.env.outputs.name }}
        run: terraform init

      - name: Terraform Apply
        working-directory: OPC/cerebro-hive-website/infra/terraform/environments/${{ steps.env.outputs.name }}
        run: |
          terraform apply \
            -auto-approve \
            -var-file=terraform.tfvars \
            2>&1 | tee apply-output.txt

      - name: Upload apply output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: terraform-apply-${{ steps.env.outputs.name }}-${{ github.run_id }}
          path: OPC/cerebro-hive-website/infra/terraform/environments/${{ steps.env.outputs.name }}/apply-output.txt
          retention-days: 30
