name: Agent Auto-Dispatch

# Triggers after a successful merge to main — picks the next pending milestone
# from AGENT-RUNTIME-BACKLOG.md and dispatches Claude + Gemini in parallel
# to implement it, then opens a PR and waits for CI.

on:
  push:
    branches:
      - main
    # Only trigger when a real feature/fix lands — not when the backlog-status
    # commit itself pushes (those are tagged [skip ci]).
    paths-ignore:
      - "AGENT-RUNTIME-BACKLOG.md"
      - ".agents/logs/**"

  # Allow manual kick-off from the Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (parse + print plan, no execution)"
        type: boolean
        default: false
      skip_ci:
        description: "Skip feature:complete (don't wait for CI / merge)"
        type: boolean
        default: false

concurrency:
  # Only one dispatch can run at a time — mirrors the "one active feature" rule
  group: agent-dispatch
  cancel-in-progress: false   # queue, don't cancel

permissions:
  contents: write        # push commits, create branches
  pull-requests: write   # open PRs
  actions: read          # read CI status

env:
  PNPM_VERSION: "9"
  NODE_VERSION: "22"


defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  # ── Optional human approval gate ─────────────────────────────────────────
  # To enable: go to Settings → Environments → create "dispatch-approval"
  # and add the required reviewers you want to approve each dispatch.
  # Remove the `environment:` key below to disable the gate entirely.
  approve:
    name: Await dispatch approval
    runs-on: ubuntu-latest
    environment: dispatch-approval   # <-- remove this job to skip the gate
    steps:
      - run: echo "Dispatch approved — continuing."

  dispatch:
    name: Dispatch next milestone
    runs-on: ubuntu-latest
    needs: approve
    timeout-minutes: 120   # long-running: agents + CI wait

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so rebase in feature-finish works
          fetch-depth: 0
          # Use a PAT so pushes and PR creation work (GITHUB_TOKEN can't trigger
          # downstream workflows — a PAT or App token is required).
          token: ${{ secrets.GH_PAT }}

      # ── Configure git identity ────────────────────────────────────────────
      - name: Configure git
        run: |
          git config user.name  "cerebro-agent-bot"
          git config user.email "agents@cerebrohive.ai"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}

      # ── Node + pnpm ───────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Install agent CLIs ────────────────────────────────────────────────
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-cli 2>/dev/null || npm install -g @anthropic-ai/cli 2>/dev/null || true
        # Falls back gracefully if the package name changes — dispatcher also
        # accepts CLAUDE_CLI env var pointing to a custom binary.

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli 2>/dev/null || npm install -g gemini-cli 2>/dev/null || true

      # ── Install gh CLI ────────────────────────────────────────────────────
      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 && echo "gh already present" || \
          (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
            sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && \
           echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
            sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && \
           sudo apt-get update -q && sudo apt-get install -y gh)

      - name: Authenticate gh CLI
        run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      # ── Check next task ───────────────────────────────────────────────────
      - name: Inspect next task
        id: next-task
        run: |
          OUTPUT=$(node scripts/backlog-parser.mjs next)
          echo "output=$OUTPUT" >> $GITHUB_OUTPUT
          # If all done, skip the rest
          if echo "$OUTPUT" | grep -q '"done":true'; then
            echo "all_done=true" >> $GITHUB_OUTPUT
          else
            echo "all_done=false" >> $GITHUB_OUTPUT
            MILESTONE_ID=$(echo "$OUTPUT" | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).id))")
            echo "milestone_id=$MILESTONE_ID" >> $GITHUB_OUTPUT
          fi

      - name: Skip if all milestones done
        if: steps.next-task.outputs.all_done == 'true'
        run: |
          echo "✓ All milestones in AGENT-RUNTIME-BACKLOG.md are complete — nothing to dispatch."
          exit 0

      # ── Run dispatcher ────────────────────────────────────────────────────
      - name: Run agent-dispatch
        if: steps.next-task.outputs.all_done != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Timeouts / retry tuning
          AGENT_TIMEOUT_MS: "3600000"   # 60 min per agent
          AGENT_MAX_RETRIES: "3"
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ github.event.inputs.skip_ci }}" = "true" ]; then FLAGS="$FLAGS --skip-ci"; fi
          node scripts/agent-dispatch.mjs $FLAGS

      # ── Upload run logs ───────────────────────────────────────────────────
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-logs-${{ github.run_id }}
          path: |
            .agents/runs/
            .agents/logs/agent-dispatch.log
          if-no-files-found: ignore

      # ── Surface summary in Actions UI ─────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          if [ -f .agents/logs/agent-dispatch.log ]; then
            echo "## Dispatch log (last 50 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 .agents/logs/agent-dispatch.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Also append any run summary.md files
          find .agents/runs -name "summary.md" | sort | tail -1 | xargs -I{} cat {} >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
