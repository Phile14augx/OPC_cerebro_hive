name: Terraform IaC — Plan & Apply

# Manages infrastructure provisioning via Terraform for all environments.
#
# PR workflow:
#   1. fmt check  — fails if code isn't formatted
#   2. validate   — checks configuration is valid
#   3. plan       — runs `terraform plan` and posts diff to PR as a comment
#   4. OPA gate   — runs policy-gate.yml conformance checks against the plan
#
# Merge to main:
#   5. apply      — applies the plan for dev automatically
#   6. staging/prod require manual approval via GitHub Environments
#
# Required secrets:
#   AWS_ROLE_ARN          — OIDC role for AWS provider auth (per environment)
#   TF_API_TOKEN          — Terraform Cloud token (if using remote backend)
#   GITHUB_TOKEN          — auto-provided
#
# Required variables (per GitHub Environment: dev / staging / production):
#   TF_WORKSPACE          — Terraform workspace name
#   AWS_REGION            — target AWS region

on:
  pull_request:
    branches: ["main"]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["main"]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, production]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

concurrency:
  group: terraform-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false   # Never cancel an apply in progress

permissions:
  contents: read
  pull-requests: write
  id-token: write             # OIDC for AWS
  actions: read

env:
  TF_VERSION: "1.9.8"
  TF_ROOT: "infra/terraform"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"


defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  # ── Detect changed environments ──────────────────────────────────────────────
  detect-env:
    name: Detect Changed Environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed envs
        id: detect
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environments=[\"${{ inputs.environment }}\"]" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only origin/${{ github.base_ref || 'main' }}..HEAD -- infra/terraform/ 2>/dev/null || \
                      git diff --name-only HEAD~1..HEAD -- infra/terraform/)

            ENVS="[]"
            if echo "$CHANGED" | grep -qE "environments/dev|envs/dev|modules/"; then
              ENVS=$(echo "$ENVS" | python3 -c "import sys,json; d=json.load(sys.stdin); d.append('dev'); print(json.dumps(d))")
            fi
            if echo "$CHANGED" | grep -qE "environments/staging|envs/staging"; then
              ENVS=$(echo "$ENVS" | python3 -c "import sys,json; d=json.load(sys.stdin); d.append('staging'); print(json.dumps(d))")
            fi
            if echo "$CHANGED" | grep -qE "environments/production|envs/prod"; then
              ENVS=$(echo "$ENVS" | python3 -c "import sys,json; d=json.load(sys.stdin); d.append('production'); print(json.dumps(d))")
            fi

            # Default to dev if only shared modules changed
            if [ "$ENVS" == "[]" ] && [ -n "$CHANGED" ]; then
              ENVS='["dev"]'
            fi

            echo "environments=$ENVS" >> $GITHUB_OUTPUT
            echo "Detected environments: $ENVS"
          fi

  # ── Format & Validate ────────────────────────────────────────────────────────
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: detect-env
    if: needs.detect-env.outputs.environments != '[]'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Post fmt status to PR
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Terraform Format Check Failed

              Run \`terraform fmt -recursive\` in \`infra/terraform/\` to fix formatting.`
            })

      - name: Fail on fmt error
        if: steps.fmt.outcome == 'failure'
        run: exit 1

      - name: Terraform Init (validate only)
        working-directory: ${{ env.TF_ROOT }}/environments/dev
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_ROOT }}/environments/dev
        run: terraform validate

  # ── Plan ─────────────────────────────────────────────────────────────────────
  plan:
    name: Plan — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [detect-env, validate]
    if: needs.detect-env.outputs.environments != '[]'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.detect-env.outputs.environments) }}
    environment:
      name: ${{ matrix.environment }}
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: TerraformPlan-${{ matrix.environment }}-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: true

      - name: Determine TF directory
        id: tfdir
        run: |
          ENV="${{ matrix.environment }}"
          if [ "$ENV" == "production" ]; then ENV_PATH="production"; else ENV_PATH="$ENV"; fi
          TFDIR="$GITHUB_WORKSPACE/${{ env.TF_ROOT }}/environments/$ENV_PATH"
          if [ ! -d "$TFDIR" ]; then
            TFDIR="$GITHUB_WORKSPACE/${{ env.TF_ROOT }}/envs/$ENV_PATH"
          fi
          echo "tfdir=$TFDIR" >> $GITHUB_OUTPUT
          echo "Using TF directory: $TFDIR"

      - name: Terraform Init
        working-directory: ${{ steps.tfdir.outputs.tfdir }}
        run: terraform init -upgrade

      - name: Terraform Workspace Select
        working-directory: ${{ steps.tfdir.outputs.tfdir }}
        run: |
          terraform workspace select "${{ vars.TF_WORKSPACE || matrix.environment }}" || \
          terraform workspace new "${{ vars.TF_WORKSPACE || matrix.environment }}"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ steps.tfdir.outputs.tfdir }}
        run: |
          terraform plan \
            -detailed-exitcode \
            -no-color \
            -out=tfplan.binary \
            2>&1 | tee /tmp/tfplan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Convert plan to JSON (for OPA)
        working-directory: ${{ steps.tfdir.outputs.tfdir }}
        run: terraform show -json tfplan.binary > /tmp/tfplan.json

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.run_id }}
          path: |
            ${{ steps.tfdir.outputs.tfdir }}/tfplan.binary
            /tmp/tfplan.json
          retention-days: 7

      - name: OPA Policy Check (Terraform plan)
        run: |
          if command -v conftest &> /dev/null; then
            conftest test /tmp/tfplan.json \
              --policy infra/policy/ \
              --namespace terraform \
              --no-color
          else
            echo "conftest not installed — installing..."
            curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz
            sudo mv conftest /usr/local/bin/
            if [ -d "infra/policy" ]; then
              conftest test /tmp/tfplan.json \
                --policy infra/policy/ \
                --namespace terraform \
                --no-color
            else
              echo "No OPA policies found at infra/policy/ — skipping gate"
            fi
          fi

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          ENVIRONMENT: ${{ matrix.environment }}
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/tfplan.txt', 'utf8');
            const exitCode = process.env.EXIT_CODE;
            const env = process.env.ENVIRONMENT;

            const statusEmoji = exitCode === '0' ? '✅' : exitCode === '2' ? '📋' : '❌';
            const statusText = exitCode === '0' ? 'No changes' : exitCode === '2' ? 'Changes detected' : 'Plan failed';

            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;

            const body = `## ${statusEmoji} Terraform Plan — \`${env}\`

            **Status:** ${statusText}

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            *Plan artifact retained for 7 days. Approve & merge to apply to dev, then promote to staging/production.*`;

            // Find existing plan comment and update it
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes(`Terraform Plan — \`${env}\``)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ── Apply ─────────────────────────────────────────────────────────────────────
  apply:
    name: Apply — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [detect-env, plan]
    # Only apply on push to main or manual dispatch with action=apply
    if: |
      needs.detect-env.outputs.environments != '[]' &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    strategy:
      fail-fast: false
      max-parallel: 1   # Never apply to multiple envs simultaneously
      matrix:
        environment: ${{ fromJson(needs.detect-env.outputs.environments) }}
    environment:
      name: ${{ matrix.environment }}   # Requires GitHub Environment approval for staging/prod

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: TerraformApply-${{ matrix.environment }}-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.run_id }}

      - name: Determine TF directory
        id: tfdir
        run: |
          ENV="${{ matrix.environment }}"
          if [ "$ENV" == "production" ]; then ENV_PATH="production"; else ENV_PATH="$ENV"; fi
          TFDIR="$GITHUB_WORKSPACE/${{ env.TF_ROOT }}/environments/$ENV_PATH"
          if [ ! -d "$TFDIR" ]; then
            TFDIR="$GITHUB_WORKSPACE/${{ env.TF_ROOT }}/envs/$ENV_PATH"
          fi
          echo "tfdir=$TFDIR" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: ${{ steps.tfdir.outputs.tfdir }}
        run: terraform init -upgrade

      - name: Terraform Apply
        working-directory: ${{ steps.tfdir.outputs.tfdir }}
        run: terraform apply -auto-approve -no-color tfplan.binary

      - name: Post apply summary
        if: always()
        run: |
          echo "## Terraform Apply — ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ matrix.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
