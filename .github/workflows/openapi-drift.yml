name: OpenAPI Drift Detection

on:
  pull_request:
    paths:
      - "services/forge-api/src/**"
      - "services/forge-api/scripts/generate-openapi.ts"
  push:
    branches: [main]
    paths:
      - "services/forge-api/src/**"
  workflow_dispatch:
    inputs:
      update_spec:
        description: "Update committed openapi.json (use after intentional API changes)"
        type: boolean
        default: false

permissions:
  contents: write   # needed for --update-spec auto-commit
  pull-requests: write


defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  openapi-drift:
    name: Check OpenAPI drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so we can commit the updated spec if needed
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate the spec from current source — no database required
      - name: Generate OpenAPI spec from source
        working-directory: services/forge-api
        env:
          # Dummy values so ConfigModule doesn't throw on missing vars
          DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub"
          JWT_SECRET: "stub-secret-for-openapi-generation"
          ANTHROPIC_API_KEY: "stub"
          OPENAI_API_KEY: "stub"
          FORGE_DEFAULT_WORKSPACE_ID: "stub-workspace"
          AI_MODEL_ID: "claude-haiku-4-5-20251001"
        run: pnpm generate-openapi

      # Check if the generated spec matches the committed spec
      - name: Diff generated spec against committed spec
        id: diff
        run: |
          cd services/forge-api

          if [ ! -f openapi.json ]; then
            echo "❌ openapi.json was not generated — check the generate-openapi script"
            exit 1
          fi

          if git diff --exit-code openapi.json; then
            echo "✅ No OpenAPI drift detected"
            echo "drifted=false" >> $GITHUB_OUTPUT
          else
            echo "drifted=true" >> $GITHUB_OUTPUT
            echo ""
            echo "═══════════════════════════════════════════════════════════"
            echo "OpenAPI DRIFT DETECTED — the committed spec does not match"
            echo "the spec generated from current source code."
            echo ""
            echo "This means one or more of:"
            echo "  • A controller endpoint was added/removed/renamed"
            echo "  • A DTO field was added/removed/changed"
            echo "  • A response schema changed"
            echo "  • An @ApiOperation / @ApiTags decorator changed"
            echo ""
            echo "What to do:"
            echo "  1. If the change is INTENTIONAL: run 'pnpm generate-openapi'"
            echo "     in services/forge-api, commit openapi.json, and push."
            echo "  2. If the change is ACCIDENTAL: revert the code change."
            echo "═══════════════════════════════════════════════════════════"
            echo ""
            git diff openapi.json
          fi

      # Post diff as PR comment
      - name: Post drift report to PR
        if: steps.diff.outputs.drifted == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const diff = execSync('git -C services/forge-api diff openapi.json').toString();

            const body = `## ⚠️ OpenAPI Drift Detected

            The OpenAPI spec generated from your changes does not match \`services/forge-api/openapi.json\`.

            <details>
            <summary>Diff (click to expand)</summary>

            \`\`\`diff
            ${diff.slice(0, 8000)}
            ${diff.length > 8000 ? '\n... (truncated)' : ''}
            \`\`\`
            </details>

            **If this is intentional:** run \`pnpm generate-openapi\` in \`services/forge-api\`, commit the updated \`openapi.json\`, and push.

            **If this is accidental:** revert the code change that caused the drift.`;

            // Find or create drift comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('OpenAPI Drift Detected')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # On manual dispatch with update_spec: auto-commit the new spec
      - name: Update committed spec
        if: |
          github.event.inputs.update_spec == 'true' &&
          steps.diff.outputs.drifted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/forge-api/openapi.json
          git commit -m "chore(openapi): update committed spec [skip ci]"
          git push

      # Fail the job if drift was detected (and we're not updating)
      - name: Fail on drift
        if: |
          steps.diff.outputs.drifted == 'true' &&
          github.event.inputs.update_spec != 'true'
        run: |
          echo "❌ OpenAPI drift detected — see diff above"
          exit 1

  # Validate that the committed spec is valid OpenAPI 3.0
  validate-spec:
    name: Validate committed OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install swagger-cli
        run: npm install -g @apidevtools/swagger-cli@4

      - name: Validate openapi.json
        run: |
          swagger-cli validate services/forge-api/openapi.json
          echo "✅ OpenAPI spec is valid"

      - name: Check for required security definitions
        run: |
          python3 - <<'EOF'
          import json, sys

          with open("services/forge-api/openapi.json") as f:
              spec = json.load(f)

          errors = []

          # Every path (except /health) must have security defined
          paths = spec.get("paths", {})
          for path, methods in paths.items():
              if "/health" in path or "/ready" in path:
                  continue
              for method, op in methods.items():
                  if method == "parameters":
                      continue
                  if not op.get("security") and not spec.get("security"):
                      errors.append(f"{method.upper()} {path} — missing security definition")

          # Verify bearerAuth scheme is defined
          schemes = spec.get("components", {}).get("securitySchemes", {})
          if "bearer" not in schemes and "bearerAuth" not in schemes:
              errors.append("No bearerAuth security scheme defined in components/securitySchemes")

          if errors:
              print("❌ OpenAPI security validation failed:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print(f"✅ Security definitions valid ({len(paths)} paths checked)")
          EOF
