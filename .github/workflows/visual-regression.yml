name: Visual Regression Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate reviewed Linux screenshot baselines
        required: false
        default: false
        type: boolean

defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - uses: actions/setup-node@v7
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: OPC/cerebro-hive-website/pnpm-lock.yaml
    - name: Install dependencies
      working-directory: OPC/cerebro-hive-website
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      working-directory: OPC/cerebro-hive-website
      run: pnpm --filter @cerebro/studio exec playwright install --with-deps
    - name: Run Playwright tests
      if: ${{ !inputs.update_snapshots }}
      working-directory: OPC/cerebro-hive-website
      run: pnpm --filter @cerebro/studio run test:e2e
    - name: Generate Playwright baselines
      if: ${{ inputs.update_snapshots }}
      working-directory: OPC/cerebro-hive-website
      run: pnpm --filter @cerebro/studio run test:e2e -- --update-snapshots
    - uses: actions/upload-artifact@v7
      if: ${{ inputs.update_snapshots && !cancelled() }}
      with:
        name: playwright-snapshots
        path: OPC/cerebro-hive-website/apps/studio/tests/visual/**/*-snapshots/
        retention-days: 7
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: OPC/cerebro-hive-website/apps/studio/playwright-report/
        retention-days: 30
