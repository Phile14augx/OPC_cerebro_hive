name: Generate SBOM

on:
  push:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: OPC/cerebro-hive-website/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd OPC/cerebro-hive-website
          pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        run: |
          cd OPC/cerebro-hive-website
          npx -y @cyclonedx/cyclonedx-node --output-format JSON --output-file ../../sbom.json
          
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
