name: Documentation Validation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: OPC/cerebro-hive-website

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        continue-on-error: true
        with:
          globs: "**/*.md"

      - name: Check Markdown Links
        uses: lycheeverse/lychee-action@v2
        with:
          workingDirectory: OPC/cerebro-hive-website
          args: >-
            --no-progress
            --exclude '^/contact$'
            --exclude '^http://localhost:'
            --exclude '^https://docs\.cerebrohive\.com/'
            --exclude '^https://(alertmanager|argocd|grafana)\.cerebrohive\.com/'
            --exclude '^https://cerebrohive\.pagerduty\.com/?$'
            --exclude '^https://console\.anthropic\.com/'
            --exclude '^https://medium\.com/'
            './**/*.md'
