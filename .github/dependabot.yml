# ==============================================================================
# Dependabot Configuration
# Repository : OPC_cerebro_hive
# Owner      : Phile14augx
#
# Documentation:
# https://docs.github.com/en/code-security/dependabot
#
# Place this file at:
# .github/dependabot.yml
#
# Supported Ecosystems
# --------------------
# ✓ npm / Yarn / pnpm
# ✓ Docker
# ✓ GitHub Actions
# ==============================================================================

version: 2

updates:

# ==============================================================================
# FRONTEND / NODEJS
# ==============================================================================

  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 10

    reviewers:
      - "Phile14augx"

    assignees:
      - "Phile14augx"

    labels:
      - "dependencies"
      - "frontend"
      - "npm"

    commit-message:
      prefix: "chore"
      include: "scope"

    rebase-strategy: "auto"

    versioning-strategy: "increase"

    groups:

      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"

      nextjs:
        patterns:
          - "next"

      typescript:
        patterns:
          - "typescript"
          - "@types/*"

      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"

      testing:
        patterns:
          - "jest*"
          - "vitest*"
          - "@testing-library/*"

      ui:
        patterns:
          - "framer-motion"
          - "lucide-react"
          - "clsx"
          - "class-variance-authority"

      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "webpack"
          - "rollup"
          - "esbuild"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

# ==============================================================================
# DOCKER
# ==============================================================================

  - package-ecosystem: "docker"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    reviewers:
      - "Phile14augx"

    assignees:
      - "Phile14augx"

    labels:
      - "dependencies"
      - "docker"

    commit-message:
      prefix: "chore"

    rebase-strategy: "auto"

# ==============================================================================
# GITHUB ACTIONS
# ==============================================================================

  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    reviewers:
      - "Phile14augx"

    assignees:
      - "Phile14augx"

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"

    rebase-strategy: "auto"

    groups:

      github-actions:
        patterns:
          - "actions/*"
          - "github/*"
