version: '3.8'

# ============================================================
# CerebroHive Platform — Local Development Stack
# ============================================================
# Core:         PostgreSQL + pgvector, Redis
# Events:       NATS JetStream
# Search:       OpenSearch
# Storage:      MinIO
# Identity:     Keycloak
# Observability: OTel → Prometheus + Tempo + Loki → Grafana
# Workflow:     Temporal
# Tooling:      pgAdmin
#
# Usage:
#   docker compose up -d              # Full stack
#   docker compose up -d db redis     # Core only
#   docker compose --profile obs up -d # With observability
# ============================================================

services:

  # ─── Core Storage ──────────────────────────────────────────

  db:
    image: pgvector/pgvector:pg16
    container_name: cerebrohive-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerebrohive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-cerebrohive_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cerebrohive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cerebrohive-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Event Bus ─────────────────────────────────────────────

  nats:
    image: nats:2.10-alpine
    container_name: cerebrohive-nats
    restart: always
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
      - "--name=cerebrohive-node"
    ports:
      - "4222:4222"    # Client connections
      - "8222:8222"    # Monitoring HTTP
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Search ────────────────────────────────────────────────

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: cerebrohive-opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Opensearch@123!}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=false
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200/_cluster/health -u admin:${OPENSEARCH_PASSWORD:-Opensearch@123!} | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: cerebrohive-opensearch-dashboards
    restart: always
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-Opensearch@123!}
    depends_on:
      opensearch:
        condition: service_healthy

  # ─── Object Storage ────────────────────────────────────────

  minio:
    image: minio/minio:latest
    container_name: cerebrohive-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Identity & Auth ───────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: cerebrohive-keycloak
    restart: always
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cerebrohive_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-cerebrohive}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword123}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ─── CerebroForge™ API ────────────────────────────────────

  forge-api:
    build:
      context: .
      dockerfile: services/forge-api/Dockerfile
    container_name: cerebrohive-forge-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerebrohive}:${POSTGRES_PASSWORD:-supersecretpassword123}@db:5432/${POSTGRES_DB:-cerebrohive_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword123}@redis:6379
      FORGE_API_PORT: 4005
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL_ID: ${AI_MODEL_ID:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "4005:4005"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Workflow Engine ───────────────────────────────────────

  temporal:
    container_name: cerebrohive-temporal
    image: temporalio/auto-setup:1.24.2
    restart: always
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_SEEDS=db
      - POSTGRES_USER=${POSTGRES_USER:-cerebrohive}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-supersecretpassword123}
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      db:
        condition: service_healthy

  temporal-ui:
    container_name: cerebrohive-temporal-ui
    image: temporalio/ui:2.27.1
    restart: always
    ports:
      - "8081:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  # ─── Observability ─────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: cerebrohive-otel
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter
    profiles: ["obs", "full"]

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: cerebrohive-prometheus
    restart: always
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    profiles: ["obs", "full"]

  tempo:
    image: grafana/tempo:2.4.1
    container_name: cerebrohive-tempo
    restart: always
    command: -config.file=/etc/tempo/tempo-config.yaml
    ports:
      - "3200:3200"   # HTTP API
    volumes:
      - ./infra/docker/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    profiles: ["obs", "full"]

  loki:
    image: grafana/loki:2.9.4
    container_name: cerebrohive-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    profiles: ["obs", "full"]

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: cerebrohive-alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./infra/docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
    profiles: ["obs", "full"]

  grafana:
    image: grafana/grafana:10.3.3
    container_name: cerebrohive-grafana
    restart: always
    ports:
      - "3333:3000"   # Avoid conflict with Next.js on 3000/3001
    volumes:
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
      GF_SERVER_ROOT_URL: "http://localhost:3333"
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager
    profiles: ["obs", "full"]

  # ─── Exporters ─────────────────────────────────────────────

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: cerebrohive-postgres-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-cerebrohive}:${POSTGRES_PASSWORD:-supersecretpassword123}@db:5432/${POSTGRES_DB:-cerebrohive_db}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["obs", "full"]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: cerebrohive-redis-exporter
    restart: always
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["obs", "full"]

  # ─── New Backend Services ──────────────────────────────────

  # Rust API Gateway (port 8900)
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: cerebrohive-gateway
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8900"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: cerebro
      KEYCLOAK_CLIENT_ID: cerebro-gateway
      PLATFORM_SVC_URL: http://platform-svc:8081
      ACADEMY_SVC_URL: http://academy-svc:8082
      CRM_SVC_URL: http://crm-svc:8083
      ML_SVC_GRPC_URL: http://ml-svc:50051
      PLATFORM_API_URL: http://platform-api:4000
      FORGE_API_URL: http://forge-api:4005
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerebrohive}:${POSTGRES_PASSWORD:-supersecretpassword123}@db:5432/${POSTGRES_DB:-cerebrohive_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword123}@redis:6379
      NATS_URL: nats://nats:4222
      ALLOWED_ORIGINS: "http://localhost:3000,https://cerebrohive.com"
      RATE_LIMIT_RPS: "100"
      RATE_LIMIT_BURST: "200"
      RUST_LOG: info
    ports:
      - "8900:8900"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8900/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Java Platform Service (port 8901)
  platform-svc:
    build:
      context: services/platform-svc
      dockerfile: Dockerfile
    container_name: cerebrohive-platform-svc
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cerebrohive_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cerebrohive}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword123}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: cerebro
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      ML_SVC_ADDR: static://ml-svc:50051
      SERVER_PORT: "8081"
    ports:
      - "8901:8081"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Java Academy Service (port 8902)
  academy-svc:
    build:
      context: services/academy-svc
      dockerfile: Dockerfile
    container_name: cerebrohive-academy-svc
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cerebrohive_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cerebrohive}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword123}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: cerebro
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      ML_SVC_ADDR: static://ml-svc:50051
      SERVER_PORT: "8082"
    ports:
      - "8902:8082"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Java CRM Service (port 8903)
  crm-svc:
    build:
      context: services/crm-svc
      dockerfile: Dockerfile
    container_name: cerebrohive-crm-svc
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cerebrohive_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cerebrohive}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword123}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: cerebro
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      ML_SVC_ADDR: static://ml-svc:50051
      SERVER_PORT: "8083"
    ports:
      - "8903:8083"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # C++ ML Service (gRPC port 50051)
  ml-svc:
    build:
      context: .
      dockerfile: services/ml-svc/Dockerfile
    container_name: cerebrohive-ml-svc
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerebrohive}:${POSTGRES_PASSWORD:-supersecretpassword123}@db:5432/${POSTGRES_DB:-cerebrohive_db}
      GRPC_ADDR: "0.0.0.0:50051"
      LOG_LEVEL: info
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Next.js Marketing Site (port 3000)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: cerebrohive-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8900/api/v1}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-cerebro}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-cerebro-web}
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Tooling ───────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cerebrohive-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@cerebrohive.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

# ─── HiveSwarm Services ────────────────────────────────────

  swarm-api:
    build:
      context: ./services/swarm-api
      dockerfile: Dockerfile
    container_name: cerebrohive-swarm-api
    restart: unless-stopped
    ports:
      - "8910:8910"
    environment:
      PORT: "8910"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8910/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  swarm-runtime:
    build:
      context: ./services/swarm-runtime
      dockerfile: Dockerfile
    container_name: cerebrohive-swarm-runtime
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      NATS_URL: nats://nats:4222
      TEMPORAL_HOST: temporal:7233
      SWARM_API_URL: http://swarm-api:8910
      WORKER_CONCURRENCY: "20"
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      swarm-api:
        condition: service_healthy

  # ─── HiveSwarm M6: Learning Service ───────────────────────

  learning-service:
    build:
      context: ./services/learning-service
      dockerfile: Dockerfile
    container_name: cerebrohive-learning
    restart: unless-stopped
    ports:
      - "8950:8950"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-cerebrohive}:${POSTGRES_PASSWORD:-supersecretpassword123}@db:5432/${POSTGRES_DB:-cerebrohive_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword123}@redis:6379
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8950/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── HiveSwarm M4/M5: Tool Gateway ────────────────────────

  tool-gateway:
    build:
      context: ./services/tool-gateway
      dockerfile: Dockerfile
    container_name: cerebrohive-tool-gateway
    restart: unless-stopped
    ports:
      - "8940:8940"
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      TOOL_GATEWAY_PORT: "8940"
      LOG_LEVEL: info
      # Tool credentials — set these in your .env
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_KEY: ${JIRA_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8940/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── HiveSwarm M3: Memory Service ─────────────────────────

  memory-service:
    build:
      context: ./services/memory-service
      dockerfile: Dockerfile
    container_name: cerebrohive-memory
    restart: unless-stopped
    ports:
      - "8930:8930"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cerebrohive}:${POSTGRES_PASSWORD:-supersecretpassword123}@db:5432/${POSTGRES_DB:-cerebrohive_db}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      MEMORY_PORT: "8930"
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8930/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── HiveSwarm M2: Intelligence Layer ─────────────────────

  planner-service:
    build:
      context: ./services/planner-service
      dockerfile: Dockerfile
    container_name: cerebrohive-planner
    restart: unless-stopped
    ports:
      - "8920:8920"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword123}@redis:6379
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8920/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  router-service:
    build:
      context: ./services/router-service
      dockerfile: Dockerfile
    container_name: cerebrohive-router
    restart: unless-stopped
    ports:
      - "8921:8921"
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      ROUTER_PORT: "8921"
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8921/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  evaluation-service:
    build:
      context: ./services/evaluation-service
      dockerfile: Dockerfile
    container_name: cerebrohive-evaluator
    restart: unless-stopped
    ports:
      - "8922:8922"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8922/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  agent-runner:
    build:
      context: ./services/agent-runner
      dockerfile: Dockerfile
    container_name: cerebrohive-agent-runner
    restart: unless-stopped
    ports:
      - "8960:8960"
    environment:
      PORT: 8960
      HOST: "0.0.0.0"
      SWARM_API_URL: http://swarm-api:8910
      AGENT_RUNNER_ENDPOINT: http://agent-runner:8960
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ORCHESTRATOR_MODEL: ${ORCHESTRATOR_MODEL:-claude-sonnet-4-6}
      CRITIC_MODEL: ${CRITIC_MODEL:-claude-sonnet-4-6}
      CODING_MODEL: ${CODING_MODEL:-claude-sonnet-4-6}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-claude-sonnet-4-6}
      MAX_TOKENS: 4096
      TEMPERATURE: "0.3"
      AGENT_CONCURRENCY: 5
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8960/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - swarm-api

