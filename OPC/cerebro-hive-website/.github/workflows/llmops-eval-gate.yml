name: LLMOps — Eval Gate

on:
  pull_request:
    paths:
      - 'packages/llmops/**'
      - 'packages/ai-gateway/**'
      - 'infra/k8s/base/configmaps/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    name: LLM Eval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run LLM eval suite
        id: eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_PASS_THRESHOLD: "0.85"
          EVAL_MIN_PASS_RATE:  "0.90"
        run: |
          cd packages/llmops
          pnpm eval:run 2>&1 | tee eval-output.log

          # Parse summary from last JSON line
          SUMMARY=$(tail -1 eval-output.log)
          PASS_RATE=$(echo "$SUMMARY" | jq -r '.summary.passRate // 0')
          AVG_SCORE=$(echo "$SUMMARY" | jq -r '.summary.avgScore // 0')
          PASSED=$(echo "$SUMMARY" | jq -r '.summary.passed // 0')
          TOTAL=$(echo "$SUMMARY" | jq -r '.summary.total // 0')

          echo "pass_rate=${PASS_RATE}"   >> $GITHUB_OUTPUT
          echo "avg_score=${AVG_SCORE}"   >> $GITHUB_OUTPUT
          echo "passed=${PASSED}"         >> $GITHUB_OUTPUT
          echo "total=${TOTAL}"           >> $GITHUB_OUTPUT

          # Fail if pass rate below threshold
          FAIL=$(echo "$PASS_RATE < $EVAL_MIN_PASS_RATE" | bc -l)
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Eval gate failed: pass rate ${PASS_RATE} < threshold ${EVAL_MIN_PASS_RATE}"
            exit 1
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-results-${{ github.sha }}
          path: packages/llmops/eval-output.log

      - name: Comment eval results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PASS_RATE: ${{ steps.eval.outputs.pass_rate }}
          AVG_SCORE: ${{ steps.eval.outputs.avg_score }}
          PASSED:    ${{ steps.eval.outputs.passed }}
          TOTAL:     ${{ steps.eval.outputs.total }}
        with:
          script: |
            const passRate = parseFloat(process.env.PASS_RATE || '0');
            const avgScore = parseFloat(process.env.AVG_SCORE || '0');
            const passed   = parseInt(process.env.PASSED || '0');
            const total    = parseInt(process.env.TOTAL || '0');
            const threshold = 0.90;
            const status   = passRate >= threshold ? '✅ PASSED' : '❌ FAILED';

            const scoreBar = (score) => {
              const filled = Math.round(score * 10);
              return '█'.repeat(filled) + '░'.repeat(10 - filled) + ` ${(score * 100).toFixed(1)}%`;
            };

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🧪 LLMOps Eval Gate ${status}

            | Metric | Value |
            |--------|-------|
            | Pass Rate | ${scoreBar(passRate)} |
            | Avg Score | ${scoreBar(avgScore)} |
            | Cases Passed | ${passed} / ${total} |
            | Threshold | ${(threshold * 100).toFixed(0)}% pass rate |

            ${passRate < threshold
              ? '> ⚠️ This PR degrades LLM quality below the threshold. Review eval failures in the artifacts.'
              : '> All eval cases meet quality thresholds.'
            }`
            });
