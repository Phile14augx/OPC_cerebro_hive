name: HiveForge Architecture Conformance

on:
  push:
    branches: [main]
    paths:
      - 'hiveforge/**'
  pull_request:
    branches: [main]
    paths:
      - 'hiveforge/**'

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run HiveForge conformance checks
        run: python3 hiveforge/tools/hiveforge_conformance_check.py hiveforge
