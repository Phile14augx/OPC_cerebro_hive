name: Chaos Game Day

# Full fault injection scenarios — validates that controls behave correctly
# under real failure conditions, not just in isolation.
#
# Each scenario verifies the complete chain:
#   Fault injected → Alert fires → SLO degrades → Recovery → Evidence recorded
#
# Scenarios available:
#   postgres-primary-kill   Kill PostgreSQL primary; verify standby promotion
#   nats-leader-kill        Kill NATS leader; verify re-election + message safety
#   nats-partition          Partition NATS cluster; verify split-brain handling
#   iam-revocation          Revoke IAM perms; verify graceful degradation
#   agent-pod-kill          Kill all agent pods; verify task queue recovery
#   dns-outage              Block DNS for external deps; verify circuit breakers
#   disk-full               Fill disk on a node; verify graceful handling
#   zone-outage             Simulate AZ loss; verify cross-zone recovery
#
# Run: manual dispatch only (requires chaos-staging environment approval)
# Schedule: quarterly (first Monday of each quarter)

on:
  schedule:
    # Quarterly: first Monday of Jan, Apr, Jul, Oct at 04:00 UTC
    - cron: "0 4 1-7 1,4,7,10 1"

  workflow_dispatch:
    inputs:
      scenario:
        description: "Chaos scenario to run"
        required: true
        type: choice
        options:
          - postgres-primary-kill
          - nats-leader-kill
          - nats-partition
          - iam-revocation
          - agent-pod-kill
          - dns-outage
          - disk-full
          - all          # Run all scenarios sequentially (game day)
      duration_minutes:
        description: "Fault injection duration (minutes)"
        required: false
        default: "5"
      observation_minutes:
        description: "Post-fault observation window (minutes)"
        required: false
        default: "10"

concurrency:
  group: chaos-game-day
  cancel-in-progress: false   # Never cancel mid-game-day

permissions:
  contents: read
  id-token: write

jobs:
  # ── Pre-game-day checks ───────────────────────────────────────────────────
  pregame-checks:
    name: Pre-game-day safety checks
    runs-on: ubuntu-latest
    outputs:
      cluster_healthy: ${{ steps.health.outputs.healthy }}
      scenarios: ${{ steps.scenarios.outputs.list }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Cluster health check
        id: health
        run: |
          # Check all nodes are Ready
          NOT_READY=$(kubectl get nodes \
            --field-selector='status.conditions[?(@.type=="Ready")].status!=True' \
            -o name 2>/dev/null | wc -l)

          if [ "${NOT_READY}" -gt 0 ]; then
            echo "::error::${NOT_READY} nodes not Ready — aborting game day"
            echo "healthy=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Check no critical alerts already firing
          AM_URL="${{ secrets.ALERTMANAGER_URL }}"
          if [ -n "${AM_URL}" ]; then
            CRITICAL=$(curl -sf "${AM_URL}/api/v2/alerts?filter=severity=critical&active=true" \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" || echo "0")

            if [ "${CRITICAL}" -gt 0 ]; then
              echo "::error::${CRITICAL} critical alerts firing — aborting"
              echo "healthy=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

          # Check Chaos Mesh is installed
          kubectl get crd podchaos.chaos-mesh.org > /dev/null 2>&1 \
            || { echo "::error::Chaos Mesh not installed"; exit 1; }

          echo "healthy=true" >> $GITHUB_OUTPUT
          echo "✅ Pre-game-day checks passed"

      - name: Resolve scenario list
        id: scenarios
        run: |
          INPUT="${{ inputs.scenario }}"
          if [ "${INPUT}" = "all" ] || [ -z "${INPUT}" ]; then
            # Quarterly run: all scenarios
            echo 'list=["postgres-primary-kill","nats-leader-kill","iam-revocation","agent-pod-kill","dns-outage"]' >> $GITHUB_OUTPUT
          else
            echo "list=[\"${INPUT}\"]" >> $GITHUB_OUTPUT
          fi

  # ── Scenario: PostgreSQL primary kill ─────────────────────────────────────
  scenario-postgres:
    name: Scenario — PostgreSQL primary kill
    runs-on: ubuntu-latest
    needs: pregame-checks
    if: |
      needs.pregame-checks.outputs.cluster_healthy == 'true' &&
      (inputs.scenario == 'postgres-primary-kill' || inputs.scenario == 'all' || github.event_name == 'schedule')
    environment: chaos-staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl + AWS
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Record baseline metrics
        id: baseline
        run: |
          AM_URL="${{ secrets.ALERTMANAGER_URL }}"
          PROM_URL="${{ secrets.PROMETHEUS_URL }}"
          START_TS=$(date +%s)
          echo "start_ts=${START_TS}" >> $GITHUB_OUTPUT

          # Record baseline availability
          if [ -n "${PROM_URL}" ]; then
            AVAIL=$(curl -sf "${PROM_URL}/api/v1/query?query=sum(rate(http_requests_total%7Bstatus!~%225..%22%7D%5B5m%5D))%2Fsum(rate(http_requests_total%5B5m%5D))" \
              | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['data']['result'][0]['value'][1] if r['data']['result'] else '1.0')" \
              || echo "1.0")
            echo "baseline_avail=${AVAIL}" >> $GITHUB_OUTPUT
            echo "Baseline availability: ${AVAIL}"
          fi

      - name: Inject fault — kill PostgreSQL primary
        id: inject
        run: |
          INJECT_TS=$(date +%s)
          echo "inject_ts=${INJECT_TS}" >> $GITHUB_OUTPUT

          echo "🔴 Injecting fault: PostgreSQL primary kill"
          kubectl apply -f infra/chaos/game-days/postgres-primary-kill.yaml

          echo "Fault injected at $(date -u +%T)"

      - name: Observe — wait for promotion + alert
        id: observe
        run: |
          INJECT_TS="${{ steps.inject.outputs.inject_ts }}"
          DURATION_MIN="${{ inputs.duration_minutes || '5' }}"
          OBS_MIN="${{ inputs.observation_minutes || '10' }}"

          echo "Observing for ${OBS_MIN} minutes..."

          # Poll for PostgreSQL primary promotion
          PROMOTION_TS=""
          for i in $(seq 1 60); do
            sleep 5
            PRIMARY_READY=$(kubectl get pods -n cerebro-staging \
              -l 'app.kubernetes.io/name=postgresql,role=primary' \
              --field-selector='status.phase=Running' \
              -o name 2>/dev/null | wc -l)

            if [ "${PRIMARY_READY}" -gt 0 ]; then
              PROMOTION_TS=$(date +%s)
              PROMOTION_ELAPSED=$((PROMOTION_TS - INJECT_TS))
              echo "✅ PostgreSQL primary promoted at ${PROMOTION_ELAPSED}s"
              echo "promotion_elapsed=${PROMOTION_ELAPSED}" >> $GITHUB_OUTPUT
              break
            fi

            echo "  [${i}] Waiting for PostgreSQL primary... (${i}×5s)"
          done

          if [ -z "${PROMOTION_TS}" ]; then
            echo "::error::PostgreSQL primary not promoted within 300s"
            echo "promotion_elapsed=TIMEOUT" >> $GITHUB_OUTPUT
          fi

          # Poll for alert firing
          AM_URL="${{ secrets.ALERTMANAGER_URL }}"
          ALERT_TS=""
          if [ -n "${AM_URL}" ]; then
            for i in $(seq 1 24); do
              sleep 5
              ALERT=$(curl -sf "${AM_URL}/api/v2/alerts?filter=alertname=PostgreSQLPrimaryDown&active=true" \
                | python3 -c "import json,sys; a=json.load(sys.stdin); print(len(a))" || echo "0")

              if [ "${ALERT}" -gt 0 ]; then
                ALERT_TS=$(date +%s)
                ALERT_ELAPSED=$((ALERT_TS - INJECT_TS))
                echo "✅ Alert fired at ${ALERT_ELAPSED}s"
                echo "alert_elapsed=${ALERT_ELAPSED}" >> $GITHUB_OUTPUT
                break
              fi
              echo "  [${i}] Waiting for alert... (${i}×5s)"
            done

            if [ -z "${ALERT_TS}" ]; then
              echo "::warning::Alert PostgreSQLPrimaryDown did not fire within 120s"
              echo "alert_elapsed=TIMEOUT" >> $GITHUB_OUTPUT
            fi
          fi

          # Continue observing for full window
          REMAINING_SECS=$(( (OBS_MIN * 60) - ($(date +%s) - INJECT_TS) ))
          [ "${REMAINING_SECS}" -gt 0 ] && sleep "${REMAINING_SECS}" || true

      - name: Cleanup — remove chaos experiment
        if: always()
        run: |
          kubectl delete podchaos game-day-postgres-primary-kill \
            -n cerebro-chaos --ignore-not-found
          echo "✅ Chaos experiment removed"

      - name: Evaluate scenario results
        id: evaluate
        run: |
          INJECT_TS="${{ steps.inject.outputs.inject_ts }}"
          PROMO="${{ steps.observe.outputs.promotion_elapsed }}"
          ALERT="${{ steps.observe.outputs.alert_elapsed }}"
          END_TS=$(date +%s)
          TOTAL=$((END_TS - INJECT_TS))

          echo "=== PostgreSQL Primary Kill — Results ==="
          echo "  Promotion time:  ${PROMO}s (target: ≤ 60s)"
          echo "  Alert fire time: ${ALERT}s (target: ≤ 120s)"
          echo "  Total duration:  ${TOTAL}s"

          PASS=true

          # Gate 1: Promotion within 60s
          if [[ "${PROMO}" =~ ^[0-9]+$ ]] && [ "${PROMO}" -le 60 ]; then
            echo "✅ Promotion gate: PASS (${PROMO}s ≤ 60s)"
          else
            echo "❌ Promotion gate: FAIL (${PROMO})"
            PASS=false
          fi

          # Gate 2: Alert within 120s
          if [[ "${ALERT}" =~ ^[0-9]+$ ]] && [ "${ALERT}" -le 120 ]; then
            echo "✅ Alert gate: PASS (${ALERT}s ≤ 120s)"
          else
            echo "⚠️  Alert gate: WARN (${ALERT})"
            # Alert is a warning, not a hard failure for this scenario
          fi

          echo "scenario_pass=${PASS}" >> $GITHUB_OUTPUT
          echo "promotion_elapsed=${PROMO}" >> $GITHUB_OUTPUT
          echo "alert_elapsed=${ALERT}" >> $GITHUB_OUTPUT

      - name: Register evidence
        if: always()
        run: |
          chmod +x infra/assurance/register-evidence.sh

          STATUS="PASS"
          [ "${{ steps.evaluate.outputs.scenario_pass }}" = "false" ] && STATUS="FAIL"

          PROMO="${{ steps.evaluate.outputs.promotion_elapsed }}"
          ALERT="${{ steps.evaluate.outputs.alert_elapsed }}"

          ./infra/assurance/register-evidence.sh \
            --control CHAOS-1 \
            --status "${STATUS}" \
            --artifact "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --details "postgres-primary-kill: promotion=${PROMO}s alert=${ALERT}s" \
            --environment staging

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-day-postgres-${{ github.run_number }}
          path: |
            evidence-entry-*.json
            evidence-index.json
          retention-days: 365

  # ── Scenario: NATS leader kill ─────────────────────────────────────────────
  scenario-nats:
    name: Scenario — NATS leader kill
    runs-on: ubuntu-latest
    needs: [pregame-checks, scenario-postgres]
    if: |
      always() &&
      needs.pregame-checks.outputs.cluster_healthy == 'true' &&
      (inputs.scenario == 'nats-leader-kill' || inputs.scenario == 'all' || github.event_name == 'schedule')
    environment: chaos-staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Inject fault — kill NATS leader
        id: inject
        run: |
          INJECT_TS=$(date +%s)
          echo "inject_ts=${INJECT_TS}" >> $GITHUB_OUTPUT

          echo "🔴 Injecting fault: NATS leader kill"
          kubectl apply -f infra/chaos/game-days/nats-leader-kill.yaml

          echo "Fault injected at $(date -u +%T)"

      - name: Observe — RAFT election + stream recovery
        id: observe
        run: |
          INJECT_TS="${{ steps.inject.outputs.inject_ts }}"
          ELECTION_TS=""

          # Poll for NATS leader election completion
          for i in $(seq 1 36); do
            sleep 5
            LEADER_READY=$(kubectl get pods -n cerebro-staging \
              -l 'app.kubernetes.io/name=nats' \
              --field-selector='status.phase=Running' \
              -o name 2>/dev/null | wc -l)

            # Need at least 2 replicas running for quorum
            if [ "${LEADER_READY}" -ge 2 ]; then
              # Check JetStream is healthy via monitoring
              NATS_POD=$(kubectl get pods -n cerebro-staging \
                -l 'app.kubernetes.io/name=nats' --field-selector='status.phase=Running' \
                -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")

              if [ -n "${NATS_POD}" ]; then
                JS_ENABLED=$(kubectl exec -n cerebro-staging "${NATS_POD}" -- \
                  nats server info 2>/dev/null | grep -c "JetStream" || echo "0")
                if [ "${JS_ENABLED}" -gt 0 ]; then
                  ELECTION_TS=$(date +%s)
                  ELECTION_ELAPSED=$((ELECTION_TS - INJECT_TS))
                  echo "election_elapsed=${ELECTION_ELAPSED}" >> $GITHUB_OUTPUT
                  echo "✅ NATS leader elected at ${ELECTION_ELAPSED}s"
                  break
                fi
              fi
            fi
            echo "  [${i}] Waiting for NATS election... (${i}×5s)"
          done

          if [ -z "${ELECTION_TS}" ]; then
            echo "::error::NATS leader election timed out"
            echo "election_elapsed=TIMEOUT" >> $GITHUB_OUTPUT
          fi

      - name: Cleanup
        if: always()
        run: |
          kubectl delete podchaos game-day-nats-leader-kill \
            -n cerebro-chaos --ignore-not-found || true
          kubectl delete networkchaos game-day-nats-partition \
            -n cerebro-chaos --ignore-not-found || true

      - name: Evaluate + register evidence
        if: always()
        run: |
          chmod +x infra/assurance/register-evidence.sh
          ELECTION="${{ steps.observe.outputs.election_elapsed }}"

          PASS=true
          if [[ ! "${ELECTION}" =~ ^[0-9]+$ ]] || [ "${ELECTION}" -gt 30 ]; then
            echo "⚠️  Election > 30s target (got: ${ELECTION})"
            # Warning, not hard fail — 60s is the hard gate
            [[ "${ELECTION}" =~ ^[0-9]+$ ]] && [ "${ELECTION}" -gt 60 ] && PASS=false
          fi

          STATUS="PASS"
          [ "${PASS}" = "false" ] && STATUS="FAIL"

          ./infra/assurance/register-evidence.sh \
            --control CHAOS-1 \
            --status "${STATUS}" \
            --artifact "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --details "nats-leader-kill: election=${ELECTION}s (target: ≤30s)" \
            --environment staging

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-day-nats-${{ github.run_number }}
          path: evidence-entry-*.json
          retention-days: 365

  # ── Scenario: IAM revocation ───────────────────────────────────────────────
  scenario-iam:
    name: Scenario — IAM permission revocation
    runs-on: ubuntu-latest
    needs: [pregame-checks, scenario-nats]
    if: |
      always() &&
      needs.pregame-checks.outputs.cluster_healthy == 'true' &&
      (inputs.scenario == 'iam-revocation' || inputs.scenario == 'all' || github.event_name == 'schedule')
    environment: chaos-staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Inject fault — IAM revocation (HTTP 403)
        id: inject
        run: |
          INJECT_TS=$(date +%s)
          echo "inject_ts=${INJECT_TS}" >> $GITHUB_OUTPUT

          echo "🔴 Injecting fault: IAM revocation (403 on S3/SecretsManager)"
          kubectl apply -f infra/chaos/game-days/iam-revocation.yaml

          echo "Fault injected at $(date -u +%T)"
          DURATION_S=$(( ${{ inputs.duration_minutes || '5' }} * 60 ))
          echo "duration_s=${DURATION_S}" >> $GITHUB_OUTPUT

      - name: Probe — verify graceful degradation
        id: probe
        run: |
          INJECT_TS="${{ steps.inject.outputs.inject_ts }}"
          BASE_URL="${{ secrets.STAGING_API_URL || 'https://api-staging.cerebro-hive.io' }}"

          LEAK_FOUND=false
          CIRCUIT_OPEN=false

          for i in $(seq 1 12); do
            sleep 10

            # Test 1: API still responds (doesn't crash)
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.SLO_TEST_API_TOKEN }}" \
              "${BASE_URL}/health" || echo "000")
            echo "  [${i}×10s] /health → ${STATUS}"

            # Test 2: Error responses don't leak IAM credentials or internal paths
            ERROR_BODY=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.SLO_TEST_API_TOKEN }}" \
              "${BASE_URL}/api/projects" 2>/dev/null || echo '{}')
            if echo "${ERROR_BODY}" | grep -qiE "(arn:|AKIA|aws_secret|credential)"; then
              echo "::error::IAM credential leak detected in error response!"
              LEAK_FOUND=true
            fi

            # Test 3: After several failures, circuit breaker should open
            if [ "${STATUS}" = "503" ] || echo "${ERROR_BODY}" | grep -qi "circuit"; then
              CIRCUIT_OPEN=true
              echo "✅ Circuit breaker open (graceful degradation working)"
            fi
          done

          echo "leak_found=${LEAK_FOUND}" >> $GITHUB_OUTPUT
          echo "circuit_open=${CIRCUIT_OPEN}" >> $GITHUB_OUTPUT

      - name: Wait for fault duration
        run: |
          DURATION_S="${{ steps.inject.outputs.duration_s }}"
          ELAPSED=$(( $(date +%s) - ${{ steps.inject.outputs.inject_ts }} ))
          REMAINING=$((DURATION_S - ELAPSED))
          [ "${REMAINING}" -gt 0 ] && sleep "${REMAINING}" || true

      - name: Cleanup — remove 403 injection
        if: always()
        run: |
          kubectl delete httpchaos game-day-iam-revocation-s3 \
            -n cerebro-chaos --ignore-not-found || true
          kubectl delete httpchaos game-day-iam-revocation-secretsmanager \
            -n cerebro-chaos --ignore-not-found || true

      - name: Verify recovery
        id: recovery
        run: |
          BASE_URL="${{ secrets.STAGING_API_URL || 'https://api-staging.cerebro-hive.io' }}"
          RECOVER_TS=$(date +%s)

          # Poll for service recovery
          for i in $(seq 1 12); do
            sleep 10
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.SLO_TEST_API_TOKEN }}" \
              "${BASE_URL}/health" || echo "000")
            if [ "${STATUS}" = "200" ]; then
              RECOVERY_ELAPSED=$(( $(date +%s) - RECOVER_TS ))
              echo "recovery_elapsed=${RECOVERY_ELAPSED}" >> $GITHUB_OUTPUT
              echo "✅ Service recovered in ${RECOVERY_ELAPSED}s"
              break
            fi
            echo "  [${i}×10s] Waiting for recovery... /health → ${STATUS}"
          done

      - name: Evaluate + register evidence
        if: always()
        run: |
          chmod +x infra/assurance/register-evidence.sh

          LEAK="${{ steps.probe.outputs.leak_found }}"
          CIRCUIT="${{ steps.probe.outputs.circuit_open }}"
          RECOVERY="${{ steps.recovery.outputs.recovery_elapsed }}"

          PASS=true
          [ "${LEAK}" = "true" ] && PASS=false   # Hard fail: credential leak

          STATUS="PASS"
          [ "${PASS}" = "false" ] && STATUS="FAIL"

          ./infra/assurance/register-evidence.sh \
            --control CHAOS-1 \
            --status "${STATUS}" \
            --artifact "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --details "iam-revocation: leak=${LEAK} circuit_open=${CIRCUIT} recovery=${RECOVERY}s" \
            --environment staging

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-day-iam-${{ github.run_number }}
          path: evidence-entry-*.json
          retention-days: 365

  # ── Post-game-day summary ─────────────────────────────────────────────────
  game-day-summary:
    name: Game day summary
    runs-on: ubuntu-latest
    needs: [pregame-checks, scenario-postgres, scenario-nats, scenario-iam]
    if: always()

    steps:
      - name: Collect scenario results
        run: |
          python3 - <<'EOF'
          import json, os

          scenarios = {
              'postgres-primary-kill': '${{ needs.scenario-postgres.result }}',
              'nats-leader-kill':      '${{ needs.scenario-nats.result }}',
              'iam-revocation':        '${{ needs.scenario-iam.result }}',
          }

          all_pass = all(v in ('success', 'skipped') for v in scenarios.values())

          print("\n" + "="*60)
          print("CHAOS GAME DAY RESULTS")
          print("="*60)
          for scenario, result in scenarios.items():
              icon = "✅" if result == "success" else ("⏭️" if result == "skipped" else "❌")
              print(f"  {icon}  {scenario}: {result}")

          print(f"\nOverall: {'✅ PASS' if all_pass else '❌ FAIL'}")

          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write("## Chaos Game Day Results\n\n")
              f.write("| Scenario | Result |\n|----------|--------|\n")
              for scenario, result in scenarios.items():
                  icon = "✅" if result == "success" else ("⏭️" if result == "skipped" else "❌")
                  f.write(f"| {scenario} | {icon} {result} |\n")
              f.write(f"\n**Overall: {'✅ PASS' if all_pass else '❌ FAIL'}**\n")
          EOF

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SRE_EVIDENCE_SLACK_WEBHOOK }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request, os

          webhook_url = os.environ.get('SLACK_WEBHOOK_URL', '')
          if not webhook_url:
              exit(0)

          scenarios = {
              'postgres-primary-kill': '${{ needs.scenario-postgres.result }}',
              'nats-leader-kill':      '${{ needs.scenario-nats.result }}',
              'iam-revocation':        '${{ needs.scenario-iam.result }}',
          }
          all_pass = all(v in ('success', 'skipped') for v in scenarios.values())
          icon = "✅" if all_pass else "❌"
          run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          scenario_lines = "\n".join(
              f"{'✅' if v == 'success' else '⏭️' if v == 'skipped' else '❌'} {k}: {v}"
              for k, v in scenarios.items()
          )

          payload = {
              "text": f"{icon} *Chaos Game Day — {'PASS' if all_pass else 'FAIL'}*",
              "blocks": [{
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": f"{icon} *Chaos Game Day*\n{scenario_lines}\n\n<{run_url}|View run>"
                  }
              }]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req)
          EOF
