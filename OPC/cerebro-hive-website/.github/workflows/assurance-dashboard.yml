name: Assurance Dashboard

on:
  # Rebuild whenever the evidence chain runs (new CEC data available)
  workflow_run:
    workflows: ["Evidence Chain"]
    types: [completed]

  # Also rebuild on direct changes to the dashboard source
  push:
    branches: [main]
    paths:
      - infra/assurance/dashboard/**
      - infra/assurance/control-register.yaml

  # Manual trigger — useful for ad-hoc refreshes
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full dashboard rebuild even without new evidence'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-flight if a newer run starts
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout evidence artifacts from evidence-chain branch
        uses: actions/checkout@v4
        with:
          ref: evidence-chain
          path: evidence-data
          sparse-checkout: evidence
          sparse-checkout-cone-mode: false

      # ── Assemble static site ─────────────────────────────────────────────

      - name: Create site directory
        run: mkdir -p _site

      - name: Copy dashboard HTML
        run: cp infra/assurance/dashboard/index.html _site/index.html

      - name: Copy evidence artifacts
        run: |
          if [ -f evidence-data/evidence/control-register.json ]; then
            cp evidence-data/evidence/control-register.json _site/control-register.json
            echo "✅ control-register.json copied"
          else
            echo "⚠️  No control-register.json found — dashboard will use mock data"
            echo "{\"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"controls\": []}" > _site/control-register.json
          fi

          if [ -f evidence-data/evidence/cec-history.jsonl ]; then
            cp evidence-data/evidence/cec-history.jsonl _site/cec-history.jsonl
            echo "✅ cec-history.jsonl copied ($(wc -l < evidence-data/evidence/cec-history.jsonl) entries)"
          else
            echo "⚠️  No cec-history.jsonl found — trend chart will be empty"
            touch _site/cec-history.jsonl
          fi

          if [ -f evidence-data/evidence/cec-score.json ]; then
            cp evidence-data/evidence/cec-score.json _site/cec-score.json
          fi

      # ── Build metadata ────────────────────────────────────────────────────

      - name: Build site metadata
        run: |
          CEC_PCT="?"
          STATUS="UNKNOWN"
          if [ -f _site/cec-score.json ]; then
            CEC_PCT=$(jq -r '.cec_score_pct // "?"' _site/cec-score.json)
            STATUS=$(jq -r '.cec_status // "UNKNOWN"' _site/cec-score.json)
          fi

          cat > _site/build-info.json <<EOF
          {
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref_name }}",
            "workflow_run": "${{ github.run_id }}",
            "cec_score_pct": "$CEC_PCT",
            "cec_status": "$STATUS"
          }
          EOF
          echo "Build metadata:"
          cat _site/build-info.json

      # ── Validate ──────────────────────────────────────────────────────────

      - name: Validate site output
        run: |
          echo "Site contents:"
          ls -lh _site/

          # index.html must exist and be non-trivial
          HTMLSIZE=$(stat -c%s _site/index.html)
          if [ "$HTMLSIZE" -lt 5000 ]; then
            echo "❌ index.html too small (${HTMLSIZE} bytes) — build may have failed"
            exit 1
          fi
          echo "✅ index.html: ${HTMLSIZE} bytes"

          # control-register.json must be valid JSON
          jq . _site/control-register.json > /dev/null
          echo "✅ control-register.json is valid JSON"

          # Check how many controls are in the register
          NCONTROLS=$(jq '.controls | length' _site/control-register.json 2>/dev/null || echo 0)
          echo "✅ $NCONTROLS controls in register"

          # Warn if CEC trend is empty
          NHISTORY=$(wc -l < _site/cec-history.jsonl)
          if [ "$NHISTORY" -eq 0 ]; then
            echo "⚠️  cec-history.jsonl is empty — trend chart will show placeholder"
          else
            echo "✅ cec-history.jsonl: $NHISTORY entries"
          fi

      - name: Summarize build
        run: |
          CEC_PCT=$(jq -r '.cec_score_pct // "?"' _site/cec-score.json 2>/dev/null || echo "?")
          STATUS=$(jq -r '.cec_status // "UNKNOWN"' _site/cec-score.json 2>/dev/null || echo "UNKNOWN")
          NCONTROLS=$(jq '.controls | length' _site/control-register.json 2>/dev/null || echo 0)
          NHISTORY=$(wc -l < _site/cec-history.jsonl)

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 📊 Assurance Dashboard Build

          | Field | Value |
          |---|---|
          | CEC Score | **${CEC_PCT}%** |
          | CEC Status | ${STATUS} |
          | Controls | ${NCONTROLS} |
          | History entries | ${NHISTORY} |
          | Built at | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | Git SHA | \`${{ github.sha }}\` |
          EOF

      # ── Upload Pages artifact ─────────────────────────────────────────────

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Post deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 Deployment

          Dashboard live at: ${{ steps.deploy.outputs.page_url }}
          EOF

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_EVIDENCE_WEBHOOK }}

    steps:
      - name: Download evidence for notification
        uses: actions/download-artifact@v4
        with:
          pattern: github-pages
          merge-multiple: true
        continue-on-error: true

      - name: Post to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          BUILD_STATUS="${{ needs.build.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          ICON="📊"
          COLOR="good"
          if [ "$BUILD_STATUS" != "success" ] || [ "$DEPLOY_STATUS" != "success" ]; then
            ICON="⚠️"
            COLOR="warning"
          fi

          # Read CEC from build if available
          CEC_PCT=$(jq -r '.cec_score_pct // "?"' _site/cec-score.json 2>/dev/null || echo "?")
          DASHBOARD_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

          curl -fsSL -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"fallback\": \"${ICON} CerebroHive Assurance Dashboard updated — CEC: ${CEC_PCT}%\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"${ICON} *Assurance Dashboard Updated*\nCEC Score: *${CEC_PCT}%* | Build: ${BUILD_STATUS} | Deploy: ${DEPLOY_STATUS}\"
                    },
                    \"accessory\": {
                      \"type\": \"button\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"View Dashboard\" },
                      \"url\": \"${DASHBOARD_URL}\"
                    }
                  },
                  {
                    \"type\": \"context\",
                    \"elements\": [{
                      \"type\": \"mrkdwn\",
                      \"text\": \"SHA: \`${{ github.sha }}\` | Run: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\"
                    }]
                  }
                ]
              }]
            }"
