name: SecurityOps — Regenerate Lockfile

# ──────────────────────────────────────────────────────────────────────────────
# Regenerates pnpm-lock.yaml with the current pnpm.overrides and any direct
# dependency changes, then commits the result so Trivy picks up patched versions.
#
# Triggers:
#   • Any push that touches package.json or any app/package/package.json
#   • Manual dispatch (for on-demand regeneration after adding overrides)
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - "services/**/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    name: Regenerate pnpm-lock.yaml
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install (regenerate lockfile with current overrides)
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Check for lockfile changes
        id: diff
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Lockfile changes:"
            git diff --stat pnpm-lock.yaml
          fi

      - name: Commit updated lockfile
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security(deps): regenerate lockfile with patched versions [skip-healbot]"
          git push origin ${{ github.ref_name }}

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "✅ Lockfile regenerated and pushed — Trivy will rescan on next push"
          else
            echo "ℹ️ Lockfile unchanged — all overrides already applied"
          fi
