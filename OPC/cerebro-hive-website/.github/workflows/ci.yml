# NOT GitHub-visible. GitHub Actions only loads `.github/workflows/*.yml` at
# the repository root. Canonical W0.2 / website CI:
#   .github/workflows/website-ci.yml
# Keep this file for docs/local references. Do not treat it as a second CI system.
name: CI

on:
  push:
    branches: ["main", "develop", "release/*"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PNPM_VERSION: "9"
  NODE_VERSION: "22"

jobs:
  # ── Job 1: Typecheck + Lint ───────────────────────────────────────────────
  typecheck-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Turborepo)
        run: pnpm turbo typecheck --color

      - name: Lint (Turborepo)
        run: pnpm turbo lint --color

      # Confirmed gap (2026-08-01): `pnpm-workspace.yaml` only declares
      # apps/*, packages/*, packages/capabilities/*, services/* as workspace
      # packages. The root-level Next.js app (app/, components/, lib/, its
      # own tsconfig.json) is NOT a workspace package, and Turborepo does not
      # include the root package in `turbo typecheck`/`turbo lint` above —
      # so a type error introduced there was previously invisible to CI.
      # This step runs the root's own tsconfig.json directly, matching what
      # `pnpm typecheck:root` runs locally (see root package.json).
      - name: Typecheck root Next.js app (not a Turborepo workspace package)
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Typecheck root dashboard tests
        run: pnpm typecheck:test

      # Lint the root Next.js app (app/, components/, lib/). Same gap as the
      # typecheck step above: turbo lint only covers workspace packages. Config
      # is eslint.config.mjs at repo root; ignores apps/**, packages/**, etc.
      # so this does not double-lint packages that have their own configs.
      - name: Lint root Next.js app (not a Turborepo workspace package)
        run: pnpm lint:root

      # Catches the two silent SEO failures: a page that exists but is absent
      # from the sitemap, and a sitemap entry whose page has been deleted.
      - name: Sitemap drift check
        run: pnpm sitemap:check

      # KRN-CI-001 / W0.2: classify every workspace package and fail on
      # missing required scripts or prohibited no-ops (exit 0 / true / echo no tests).
      # Dummy scripts for all 141 packages are not the fix; exemptions are YAML.
      - name: Repository policy check
        run: pnpm repo:policy

      - name: Workspace contract audit (fail-closed)
        run: node scripts/audit-workspace-contracts.mjs

  # ── Job 2: Unit Tests ─────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm turbo test -- --coverage --reporter=verbose --reporter=junit --outputFile=test-results.xml
        env:
          CI: true
          VITEST_POOL: forks

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/test-results.xml
            **/coverage/**

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/test-results.xml"
          check_name: Unit Test Results

  # ── Job 3: Build ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and apps (Turborepo)
        run: pnpm turbo build --color
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/studio/.next/**
            apps/forge/.next/**
            apps/platform-api/dist/**
            services/forge-api/dist/**
          retention-days: 1

  # ── Job 4: Storybook ──────────────────────────────────────────────────────
  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @cerebro/studio build-storybook --output-dir storybook-static
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Upload Storybook static build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/studio/storybook-static/
          retention-days: 7

  # ── Job 5: Visual Regression (Chromatic) ──────────────────────────────────
  visual-regression:
    name: Visual Regression (Chromatic)
    runs-on: ubuntu-latest
    needs: [storybook]
    # Only run on PRs to avoid exhausting Chromatic quota on every push
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic needs full git history

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Storybook static build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: apps/studio/storybook-static/

      - name: Run Chromatic visual regression
        # Pinned to a major version rather than @latest: a floating tag means an
        # upstream release can silently change what runs against a repo secret.
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: apps/studio/storybook-static
          exitZeroOnChanges: true # Don't fail CI — open a review instead
          autoAcceptChanges: "main" # Auto-accept on main (already reviewed)
          onlyChanged: true # Only test stories that changed

  # ── Job 6: Bundle Analysis ────────────────────────────────────────────────
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Analyze studio bundle
        run: |
          pnpm --filter @cerebro/studio exec \
            next-bundle-analyzer --json > /tmp/studio-bundle.json || true

      - name: Analyze bundle with @next/bundle-analyzer
        working-directory: apps/studio
        run: |
          ANALYZE=true pnpm build 2>&1 | tee /tmp/bundle-output.txt || true
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Comment bundle sizes on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('/tmp/bundle-output.txt')
              ? fs.readFileSync('/tmp/bundle-output.txt', 'utf8')
                  .split('\n')
                  .filter(l => l.includes('kB') || l.includes('First Load'))
                  .slice(0, 30)
                  .join('\n')
              : 'Bundle analysis output not available';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📦 Bundle Analysis — @cerebro/studio\n\n\`\`\`\n${output}\n\`\`\``
            });

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: /tmp/bundle-output.txt
          retention-days: 7

  # ── Job 7: Go services build + vet ────────────────────────────────────────
  go-services:
    name: Go Services (build + vet + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/swarm-api
          - services/swarm-runtime
          - services/memory-service
          - services/router-service
          - services/tool-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Build
        working-directory: ${{ matrix.service }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.service }}
        run: go test -race -timeout 60s ./...

  # ── Job 8: Python services lint + test ────────────────────────────────────
  python-services:
    name: Python Services (lint + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/agent-runner
          - services/planner-service
          - services/evaluation-service
          - services/learning-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx \
            fastapi uvicorn[standard] anthropic pydantic pydantic-settings structlog \
            --break-system-packages 2>/dev/null || \
          pip install ruff pytest pytest-asyncio httpx \
            fastapi "uvicorn[standard]" anthropic pydantic pydantic-settings structlog

      - name: Ruff lint
        working-directory: ${{ matrix.service }}
        run: ruff check src/ || true

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: pytest src/ -x -q --tb=short || true
        env:
          PYTHONPATH: src

  # ── Job 9: JVM services (Gradle) ──────────────────────────────────────────
  jvm-services:
    name: JVM Services (Gradle build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/academy-svc
          - services/crm-svc
          - services/platform-svc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build with Gradle
        working-directory: ${{ matrix.service }}
        run: ./gradlew build -x test --no-daemon

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./gradlew test --no-daemon || true

  # ── CI Gate: all required checks must pass ────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - typecheck-lint
      - unit-tests
      - build
      - go-services
      - python-services
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "The following required jobs failed or were skipped:"
            echo "$failed"
            exit 1
          fi
          echo "All required CI checks passed ✅"
