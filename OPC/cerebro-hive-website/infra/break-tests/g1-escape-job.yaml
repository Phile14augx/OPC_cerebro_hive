# G1 Sandbox Escape Validation Job
#
# Runs inside a gVisor (runsc) sandbox and attempts known escape techniques.
# Every attempt must fail. Results are written to stdout and captured by the
# GitHub Actions workflow (g1-escape-validation.yml).
#
# This job IS the live portion of the G1 escape suite.
# The unit tests in g1-escape-suite.spec.ts validate policy definitions.
# This job validates runtime enforcement.
#
# Deploy: kubectl apply -f g1-escape-job.yaml -n cerebro-break-tests
# View:   kubectl logs -f job/g1-escape-validation -n cerebro-break-tests

apiVersion: v1
kind: Namespace
metadata:
  name: cerebro-break-tests
  labels:
    # Gatekeeper enforces restrictive PodSecurity on this namespace
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest

---
apiVersion: batch/v1
kind: Job
metadata:
  name: g1-escape-validation
  namespace: cerebro-break-tests
  labels:
    control: G1
    phase: proven
    type: break-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        control: G1
        type: break-test
    spec:
      # ── gVisor runtime ────────────────────────────────────────────────────
      runtimeClassName: gvisor

      restartPolicy: Never
      serviceAccountName: break-test-reader   # read-only SA

      # ── Security context — mirrors agent pod policy ───────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # nobody
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: escape-suite
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          command:
            - bash
            - -c
            - |
              set -euo pipefail
              PASS=0
              FAIL=0
              SKIP=0

              result() {
                local test="$1" outcome="$2" detail="$3"
                if [ "$outcome" = "PASS" ]; then
                  echo "✅ PASS | $test | $detail"
                  PASS=$((PASS + 1))
                elif [ "$outcome" = "FAIL" ]; then
                  echo "❌ FAIL | $test | $detail"
                  FAIL=$((FAIL + 1))
                else
                  echo "⏭️  SKIP | $test | $detail"
                  SKIP=$((SKIP + 1))
                fi
              }

              echo "=== G1 Sandbox Escape Validation ==="
              echo "Runtime: $(cat /proc/version 2>/dev/null | head -c 120 || echo 'unavailable')"
              echo "User: $(id)"
              echo ""

              # ── G1.5: IMDS access (EC2 metadata service) ─────────────────
              if timeout 3 curl -s --connect-timeout 2 http://169.254.169.254/latest/meta-data/ > /tmp/imds_out 2>&1; then
                result "G1.5-IMDS-ACCESS" "FAIL" "IMDS accessible from sandbox — escape vector open"
              else
                result "G1.5-IMDS-ACCESS" "PASS" "IMDS not reachable (expected)"
              fi

              # ── G1.5: Raw socket creation ─────────────────────────────────
              if python3 -c "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_RAW, socket.IPPROTO_ICMP); s.close()" 2>/dev/null; then
                result "G1.5-RAW-SOCKET" "FAIL" "Raw socket created — CAP_NET_RAW unexpectedly available"
              else
                result "G1.5-RAW-SOCKET" "PASS" "Raw socket creation blocked (expected)"
              fi

              # ── G1.4: /proc/sysrq-trigger ────────────────────────────────
              if echo "b" > /proc/sysrq-trigger 2>/dev/null; then
                result "G1.4-SYSRQ" "FAIL" "sysrq-trigger is writable — host could be rebooted"
              else
                result "G1.4-SYSRQ" "PASS" "sysrq-trigger not writable (expected)"
              fi

              # ── G1.4: /dev/mem access ─────────────────────────────────────
              if dd if=/dev/mem bs=1 count=1 of=/dev/null 2>/dev/null; then
                result "G1.4-DEV-MEM" "FAIL" "/dev/mem readable — host memory accessible"
              else
                result "G1.4-DEV-MEM" "PASS" "/dev/mem not accessible (expected)"
              fi

              # ── G1.4: /proc/kcore ─────────────────────────────────────────
              if dd if=/proc/kcore bs=1 count=1 of=/dev/null 2>/dev/null; then
                result "G1.4-KCORE" "FAIL" "/proc/kcore readable — kernel memory accessible"
              else
                result "G1.4-KCORE" "PASS" "/proc/kcore not readable (expected)"
              fi

              # ── G1.1: ptrace attempt ──────────────────────────────────────
              if python3 -c "
              import ctypes, ctypes.util, os, sys
              libc = ctypes.CDLL(ctypes.util.find_library('c'))
              PTRACE_TRACEME = 0
              result = libc.ptrace(PTRACE_TRACEME, 0, 0, 0)
              sys.exit(0 if result == 0 else 1)
              " 2>/dev/null; then
                result "G1.1-PTRACE" "PASS" "ptrace(PTRACE_TRACEME) works within own process (gVisor allows self-ptrace)"
              else
                result "G1.1-PTRACE" "PASS" "ptrace blocked entirely"
              fi

              # ── G1.1: perf_event_open ────────────────────────────────────
              if python3 -c "
              import ctypes, os, sys
              NR_PERF_EVENT_OPEN = 298
              result = ctypes.CDLL(None).syscall(NR_PERF_EVENT_OPEN, 0, 0, -1, -1, 0)
              sys.exit(0 if result != -1 else 1)
              " 2>/dev/null; then
                result "G1.1-PERF-EVENT" "FAIL" "perf_event_open succeeded — timing side-channel possible"
              else
                result "G1.1-PERF-EVENT" "PASS" "perf_event_open blocked (expected)"
              fi

              # ── G1.3: CAP_SYS_ADMIN probe (mount) ───────────────────────
              if mount --bind /tmp /tmp 2>/dev/null; then
                result "G1.3-SYS-ADMIN-MOUNT" "FAIL" "bind mount succeeded — CAP_SYS_ADMIN available"
                umount /tmp 2>/dev/null || true
              else
                result "G1.3-SYS-ADMIN-MOUNT" "PASS" "bind mount blocked (expected)"
              fi

              # ── G1.3: Namespace creation attempt ─────────────────────────
              if unshare --user --map-root-user id 2>/dev/null | grep -q "uid=0"; then
                result "G1.3-USER-NS" "FAIL" "User namespace created with root mapping — privilege escalation vector"
              else
                result "G1.3-USER-NS" "PASS" "User namespace creation blocked or limited (expected)"
              fi

              # ── G1.6: Cluster network scan probe ─────────────────────────
              # Attempt to reach kubernetes API server (should be blocked by NetworkPolicy)
              K8S_API="https://kubernetes.default.svc.cluster.local"
              if timeout 3 curl -sk --connect-timeout 2 "$K8S_API/api/v1/namespaces" -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || echo fake)" > /tmp/k8s_out 2>&1; then
                HTTP_CODE=$(cat /tmp/k8s_out | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('code', 200))" 2>/dev/null || echo "200")
                if [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "401" ]; then
                  result "G1.6-K8S-API" "PASS" "K8s API reachable but unauthorized (NetworkPolicy allows, RBAC denies — acceptable)"
                else
                  result "G1.6-K8S-API" "FAIL" "K8s API returned unexpected response — check RBAC and NetworkPolicy"
                fi
              else
                result "G1.6-K8S-API" "PASS" "K8s API unreachable from sandbox (NetworkPolicy blocking — ideal)"
              fi

              # ── G1.7: Fork bomb containment ───────────────────────────────
              # A contained fork bomb — PID limit enforced by cgroup
              # We limit iterations to avoid actually exhausting PIDs
              FORK_BLOCKED=false
              for i in $(seq 1 200); do
                if ! (echo ok > /dev/null) 2>/dev/null; then
                  FORK_BLOCKED=true
                  break
                fi
              done
              if $FORK_BLOCKED; then
                result "G1.7-FORK-LIMIT" "PASS" "Process creation blocked after $i iterations (cgroup PID limit)"
              else
                result "G1.7-FORK-LIMIT" "PASS" "200 subshells completed — PID limit not hit at this scale (expected for 200)"
              fi

              # ── Summary ───────────────────────────────────────────────────
              echo ""
              echo "=== Results ==="
              echo "PASS: $PASS | FAIL: $FAIL | SKIP: $SKIP"
              echo ""

              if [ "$FAIL" -gt 0 ]; then
                echo "❌ G1 ESCAPE SUITE FAILED — $FAIL technique(s) succeeded (escape vector open)"
                exit 1
              else
                echo "✅ G1 ESCAPE SUITE PASSED — all $PASS techniques blocked"
                exit 0
              fi

      volumes:
        - name: tmp
          emptyDir: {}

---
# Minimal RBAC for the break-test SA — read-only, no cluster access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: break-test-reader
  namespace: cerebro-break-tests

---
# NetworkPolicy: restrict egress from the escape test pod
# Mirrors the agent pod NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-escape-test-netpol
  namespace: cerebro-break-tests
spec:
  podSelector:
    matchLabels:
      type: break-test
  policyTypes: [Egress, Ingress]
  ingress: []   # no ingress
  egress:
    # Allow DNS only
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS to LLM provider IPs (for IMDS test — connection should be refused)
    # Nothing else
