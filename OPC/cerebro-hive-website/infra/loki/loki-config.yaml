# Loki Configuration — CerebroHive Platform
# Deployed as a microservice-mode cluster (read/write split) in production,
# single binary in dev/staging. Receives logs from Promtail/alloy agents
# running as DaemonSets on every node.
#
# Storage: AWS S3 for chunks and ruler, DynamoDB for index (production)
#          local filesystem for dev/staging

auth_enabled: false   # Multi-tenancy disabled (single-org); enforce via Grafana

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level:        info
  log_format:       json

  # Graceful shutdown timeout
  graceful_shutdown_timeout: 60s

# ── Common storage ────────────────────────────────────────────────────────────
common:
  path_prefix:    /loki
  replication_factor: 3
  ring:
    instance_addr: 0.0.0.0
    kvstore:
      store: memberlist

# ── Memberlist (cluster gossip) ───────────────────────────────────────────────
memberlist:
  join_members:
    - loki-memberlist.monitoring.svc.cluster.local:7946

# ── Ingester ─────────────────────────────────────────────────────────────────
ingester:
  lifecycler:
    ring:
      kvstore:
        store: memberlist
      replication_factor: 3
    final_sleep: 0s
  chunk_idle_period:       1h
  max_chunk_age:           1h
  chunk_target_size:       1048576    # 1 MiB
  chunk_retain_period:     30s

# ── Distributor ───────────────────────────────────────────────────────────────
distributor:
  ring:
    kvstore:
      store: memberlist

# ── Querier ───────────────────────────────────────────────────────────────────
querier:
  max_concurrent: 16
  engine:
    timeout:          300s
    max_look_back_period: 72h

# ── Query Range (split + cache) ───────────────────────────────────────────────
query_range:
  align_queries_with_step: true
  max_retries:             5
  parallelise_shardable_queries: true
  cache_results:           true
  results_cache:
    cache:
      embedded_cache:
        enabled:    true
        max_size_mb: 256
        ttl:        24h

# ── Query Scheduler ───────────────────────────────────────────────────────────
query_scheduler:
  max_outstanding_requests_per_tenant: 256

# ── Compactor ─────────────────────────────────────────────────────────────────
compactor:
  working_directory: /loki/compactor
  shared_store:      s3
  compaction_interval: 10m
  retention_enabled:   true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# ── Storage ───────────────────────────────────────────────────────────────────
storage_config:
  aws:
    s3:               s3://us-east-1/cerebro-hive-loki-chunks
    dynamodb:
      dynamodb_url:   dynamodb://us-east-1

  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location:         /loki/index_cache
    cache_ttl:              24h
    shared_store:           s3

# ── Schema ────────────────────────────────────────────────────────────────────
schema_config:
  configs:
    - from:         "2024-01-01"
      store:        boltdb-shipper
      object_store: s3
      schema:       v12
      index:
        prefix: cerebro_loki_index_
        period: 24h

# ── Limits ────────────────────────────────────────────────────────────────────
limits_config:
  # Ingestion
  ingestion_rate_mb:           64
  ingestion_burst_size_mb:     128
  per_stream_rate_limit:       32MB
  per_stream_rate_limit_burst: 64MB
  max_streams_per_user:        50000
  max_line_size:               "256KB"

  # Query
  max_query_parallelism:       32
  max_query_series:            5000
  max_entries_limit_per_query: 50000
  max_query_range:             720h   # 30 days

  # Retention (override per-tenant via per_tenant_override_config)
  retention_period: 720h   # 30 days default; extended per-tenant for compliance

# ── Ruler (alerting from log queries) ─────────────────────────────────────────
ruler:
  storage:
    type: s3
    s3:
      bucket_name: cerebro-hive-loki-ruler
  rule_path:   /loki/rules
  alertmanager_url: http://alertmanager.monitoring.svc.cluster.local:9093
  ring:
    kvstore:
      store: memberlist
  enable_api: true

# ── Ruler alert rules for logs ────────────────────────────────────────────────
# Stored in infra/loki/rules/
# Example rules:
#   - High error rate from any service pod
#   - JWT validation failures (auth attacks)
#   - Forge-api agent timeout spikes
#   - Unexpected panic/fatal logs

# ── Frontend ─────────────────────────────────────────────────────────────────
frontend:
  compress_responses:    true
  log_queries_longer_than: 5s
  downstream_url:        http://loki-read.monitoring.svc.cluster.local:3100

# ── Pattern Ingester (AI-assisted log clustering) ─────────────────────────────
pattern_ingester:
  enabled: true

# ── Analytics ────────────────────────────────────────────────────────────────
analytics:
  reporting_enabled: false
