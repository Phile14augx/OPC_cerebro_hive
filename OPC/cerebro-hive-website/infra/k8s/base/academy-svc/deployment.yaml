apiVersion: apps/v1
kind: Deployment
metadata:
  name: academy-svc
  namespace: cerebro-hive
  labels:
    app.kubernetes.io/name: academy-svc
    app.kubernetes.io/component: academy-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: academy-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: academy-svc
        app.kubernetes.io/component: academy-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: academy-svc
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: academy-svc
          image: cerebrohive/academy-svc:latest
          ports:
            - containerPort: 8082
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://$(POSTGRES_HOST):5432/$(POSTGRES_DB)
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: postgres-host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: postgres-db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: postgres-password
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: keycloak-url
            - name: KEYCLOAK_REALM
              value: cerebro
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: redis-url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: nats-url
            - name: ML_SVC_ADDR
              value: static://ml-svc:50051
            - name: JAVA_OPTS
              value: "-XX:+UseZGC -XX:MaxRAMPercentage=75"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: academy-svc
  namespace: cerebro-hive
  labels:
    app.kubernetes.io/name: academy-svc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: academy-svc
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: academy-svc
  namespace: cerebro-hive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: academy-svc
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
