# Prometheus via kube-prometheus-stack operator
# Install the operator first:
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring --create-namespace
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: cerebro-hive
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cerebro-hive
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  version: v2.53.0
  retention: 15d
  retentionSize: "45GB"
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/part-of: cerebro-hive
  ruleSelector:
    matchLabels:
      prometheus: kube-prometheus
      role: alert-rules
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
  externalLabels:
    cluster: cerebro-hive-production
    environment: production
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cerebro-hive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
---
# ServiceMonitor — scrape all CerebroHive services
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cerebro-hive-services
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cerebro-hive
spec:
  namespaceSelector:
    matchNames:
      - cerebro-hive
  selector:
    matchLabels:
      app.kubernetes.io/part-of: cerebro-hive
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# PrometheusRule — CerebroHive platform alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cerebro-hive-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cerebro-hive
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: cerebro-hive.availability
      interval: 30s
      rules:
        - alert: CerebroHiveServiceDown
          expr: up{job=~"cerebro-hive.*"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "CerebroHive service {{ $labels.job }} is down"
            description: "{{ $labels.job }} has been down for more than 2 minutes. Immediate action required."
            runbook: "https://wiki.cerebrohive.com/runbooks/service-down"

        - alert: CerebroHiveHighErrorRate
          expr: |
            (
              rate(http_requests_total{job=~"cerebro-hive.*",status=~"5.."}[5m])
              / rate(http_requests_total{job=~"cerebro-hive.*"}[5m])
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High 5xx error rate on {{ $labels.job }}"
            description: "Error rate is {{ $value | humanizePercentage }} over the last 5m."

        - alert: CerebroHiveHighLatencyP99
          expr: |
            histogram_quantile(0.99,
              rate(http_request_duration_seconds_bucket{job=~"cerebro-hive.*"}[5m])
            ) > 2
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "P99 latency above 2s on {{ $labels.job }}"
            description: "P99 latency is {{ $value | humanizeDuration }}."

    - name: cerebro-hive.swarm
      rules:
        - alert: SwarmQueueBacklog
          expr: swarm_queue_depth > 1000
          for: 3m
          labels:
            severity: warning
            team: ai-ops
          annotations:
            summary: "HiveSwarm task queue backlog is high"
            description: "Queue depth: {{ $value }} tasks."

        - alert: AgentRunnerOOM
          expr: |
            container_memory_usage_bytes{container="agent-runner"}
            / container_spec_memory_limit_bytes{container="agent-runner"} > 0.9
          for: 2m
          labels:
            severity: critical
            team: ai-ops
          annotations:
            summary: "agent-runner near OOM"
            description: "Memory at {{ $value | humanizePercentage }} of limit."

        - alert: SwarmAgentFailureRate
          expr: rate(swarm_agent_failures_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
            team: ai-ops
          annotations:
            summary: "Elevated agent failure rate in HiveSwarm"
            description: "Agent failure rate: {{ $value | humanize }} failures/sec."

    - name: cerebro-hive.ai-gateway
      rules:
        - alert: LLMTokenBudgetSpike
          expr: rate(llm_tokens_total[1h]) * 3600 > 1000000
          for: 0m
          labels:
            severity: warning
            team: ai-ops
          annotations:
            summary: "LLM token usage spike detected"
            description: "Projected hourly token usage: {{ $value | humanize }}."

        - alert: LLMAPIErrors
          expr: rate(llm_api_errors_total[5m]) > 0.5
          for: 3m
          labels:
            severity: critical
            team: ai-ops
          annotations:
            summary: "LLM API error rate high"
            description: "LLM errors: {{ $value | humanize }}/sec. Check API key and provider status."

    - name: cerebro-hive.infrastructure
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="cerebro-hive"}[15m]) * 60 * 15 > 5
          for: 0m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod has restarted {{ $value }} times in the last 15 minutes."

        - alert: PersistentVolumeAlmostFull
          expr: |
            kubelet_volume_stats_available_bytes{namespace="cerebro-hive"}
            / kubelet_volume_stats_capacity_bytes{namespace="cerebro-hive"} < 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is almost full"
            description: "Only {{ $value | humanizePercentage }} space remaining."
---
# Alertmanager
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: cerebro-hive
  namespace: monitoring
spec:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-cerebro-hive
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/slack-webhook-url
    receivers:
      - name: "null"
      - name: slack-critical
        slack_configs:
          - channel: "#cerebro-alerts-critical"
            send_resolved: true
            title: '{{ template "slack.default.title" . }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
      - name: slack-warnings
        slack_configs:
          - channel: "#cerebro-alerts"
            send_resolved: true
    route:
      group_by: ["alertname", "cluster", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: slack-warnings
      routes:
        - match: { severity: critical }
          receiver: slack-critical
          repeat_interval: 1h
        - match: { severity: warning }
          receiver: slack-warnings
