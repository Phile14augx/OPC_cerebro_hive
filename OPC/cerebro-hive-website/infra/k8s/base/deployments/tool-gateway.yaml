apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-gateway
  labels:
    app.kubernetes.io/name: tool-gateway
    app.kubernetes.io/part-of: cerebro-hive
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tool-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tool-gateway
        app.kubernetes.io/part-of: cerebro-hive
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8940"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cerebro-hive
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tool-gateway
          image: ghcr.io/cerebrohive/cerebro-hive/tool-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8940
              protocol: TCP
          envFrom:
            - secretRef:
                name: cerebro-hive-secrets
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tool-gateway
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: tool-gateway
  labels:
    app.kubernetes.io/name: tool-gateway
    app.kubernetes.io/part-of: cerebro-hive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tool-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tool-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tool-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tool-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tool-gateway
