---
# KEDA ScaledObjects — CerebroHive Platform
# Autoscales deployments based on NATS JetStream queue depth.
# Ref: https://keda.sh/docs/2.14/scalers/nats-jetstream/

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: forge-api-scaledobject
  namespace: cerebro-prod
  labels:
    app.kubernetes.io/name:       forge-api
    app.kubernetes.io/component:  scaledobject
spec:
  scaleTargetRef:
    apiVersion:  apps/v1
    kind:        Deployment
    name:        forge-api
  minReplicaCount:   2
  maxReplicaCount:  20
  pollingInterval:  15     # seconds
  cooldownPeriod:  120     # seconds before scale-down
  fallback:
    failureThreshold: 3
    replicas:         3   # Maintain safe minimum on KEDA errors
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
            - type:          Pods
              value:         2
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type:          Pods
              value:         4
              periodSeconds: 15
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats-monitoring.nats.svc.cluster.local:8222
        account:                      "$G"
        stream:                       CEREBRO_WORKFLOW
        consumer:                     forge-api-consumer
        lagThreshold:                 "50"
        activationLagThreshold:       "5"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: knowledge-indexer-scaledobject
  namespace: cerebro-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       knowledge-indexer
  minReplicaCount:  1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod:  300
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats-monitoring.nats.svc.cluster.local:8222
        account:                      "$G"
        stream:                       CEREBRO_KNOWLEDGE
        consumer:                     knowledge-indexer-consumer
        lagThreshold:                 "20"
        activationLagThreshold:       "1"

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: temporal-worker-scaledobject
  namespace: cerebro-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       temporal-worker
  minReplicaCount:   2
  maxReplicaCount:  30
  pollingInterval:  15
  cooldownPeriod:  120
  triggers:
    # Scale on Temporal workflow task queue depth via Prometheus
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName:    temporal_workflow_task_schedule_to_start_latency_p99
        threshold:     "5000"  # 5 seconds schedule-to-start latency p99
        query: |
          histogram_quantile(0.99,
            rate(temporal_workflow_task_schedule_to_start_latency_bucket{
              task_queue="cerebro-workflows"
            }[2m])
          ) * 1000
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"

---
# KEDA NatsTriggerAuthentication — uses Nats connection string from Secret
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: nats-trigger-auth
  namespace: cerebro-prod
spec:
  secretTargetRef:
    - parameter: natsServerMonitoringEndpoint
      name:      cerebro-nats-credentials
      key:       monitoring-url

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: platform-api-scaledobject
  namespace: cerebro-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       platform-api
  minReplicaCount:   2
  maxReplicaCount:  20
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName:    http_requests_in_flight
        threshold:     "100"
        query: |
          sum(rate(http_requests_total{service="platform-api"}[1m]))
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
