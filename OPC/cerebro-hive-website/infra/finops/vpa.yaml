# ──────────────────────────────────────────────────────────────────────────────
# FinOps — Vertical Pod Autoscaler (VPA) Configurations
# Mode: "Off" = recommendations only (no auto-apply in production).
# Apply: kubectl apply -f infra/finops/vpa.yaml
# ──────────────────────────────────────────────────────────────────────────────

# ── studio ────────────────────────────────────────────────────────────────────
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: studio-vpa
  namespace: cerebro-hive
  labels:
    app.kubernetes.io/name: studio
    app.kubernetes.io/component: frontend
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: studio
  updatePolicy:
    updateMode: "Off"   # Recommendations only — apply via GitOps after review
  resourcePolicy:
    containerPolicies:
      - containerName: studio
        minAllowed:
          cpu: 50m
          memory: 128Mi
        maxAllowed:
          cpu: 2000m
          memory: 2Gi
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits

