# ──────────────────────────────────────────────────────────────────────────────
# CerebroHive Helm Chart — Default Values (production)
# ──────────────────────────────────────────────────────────────────────────────

global:
  imageRegistry: ghcr.io
  imageOrg: cerebrohive
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  environment: production
  domain: cerebrohive.com
  tls:
    enabled: true
    certManager: true
    issuer: letsencrypt-prod

  # Shared labels applied to all resources
  commonLabels:
    app.kubernetes.io/part-of: cerebro-hive
    app.kubernetes.io/managed-by: Helm

  # Resource policy (override per-service)
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ──────────────────────────────────────────────────────────────────────────────
# Services
# ──────────────────────────────────────────────────────────────────────────────

studio:
  enabled: true
  image:
    repository: ghcr.io/cerebrohive/cerebro-hive/studio
    tag: ""          # set at deploy time
    pullPolicy: IfNotPresent
  replicas: 2
  port: 3000
  env:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    PORT: "3000"
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  ingress:
    enabled: true
    host: app.cerebrohive.com
    path: /
  probes:
    liveness:  { path: /api/health, initialDelaySeconds: 30 }
    readiness: { path: /api/health, initialDelaySeconds: 10 }

forge:
  enabled: true
  image:
    repository: ghcr.io/cerebrohive/cerebro-hive/forge
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  port: 3001
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  ingress:
    enabled: true
    host: forge.cerebrohive.com
    path: /
  probes:
    liveness:  { path: /api/health, initialDelaySeconds: 30 }
    readiness: { path: /api/health, initialDelaySeconds: 10 }

platformApi:
  enabled: true
  image:
    repository: ghcr.io/cerebrohive/cerebro-hive/platform-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  port: 4000
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  ingress:
    enabled: true
    host: api.cerebrohive.com
    path: /
  probes:
    liveness:  { path: /health, initialDelaySeconds: 20 }
    readiness: { path: /health, initialDelaySeconds: 10 }

forgeApi:
  enabled: true
  image:
    repository: ghcr.io/cerebrohive/cerebro-hive/forge-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  port: 4005
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "1000m", memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  ingress:
    enabled: false
  probes:
    liveness:  { path: /health, initialDelaySeconds: 20 }
    readiness: { path: /health, initialDelaySeconds: 10 }

aiGateway:
  enabled: true
