# ──────────────────────────────────────────────────────────────────────────────
# Infrastructure dependencies
# ──────────────────────────────────────────────────────────────────────────────

postgresql:
  enabled: false    # Use managed RDS in production
  auth:
    postgresPassword: ""
    database: cerebrohive
  primary:
    persistence:
      size: 100Gi

redis:
  enabled: false    # Use managed ElastiCache in production
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      size: 10Gi

# ──────────────────────────────────────────────────────────────────────────────
# Shared secrets (mounted from K8s Secret)
# ──────────────────────────────────────────────────────────────────────────────

secrets:
  # Name of the pre-existing K8s Secret containing all credentials
  # Create with: kubectl create secret generic cerebro-hive-secrets --from-env-file=.env
  existingSecret: "cerebro-hive-secrets"

# ──────────────────────────────────────────────────────────────────────────────
# Network policy
# ──────────────────────────────────────────────────────────────────────────────

networkPolicy:
  enabled: true

# ──────────────────────────────────────────────────────────────────────────────
# Pod Disruption Budgets
# ──────────────────────────────────────────────────────────────────────────────

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ──────────────────────────────────────────────────────────────────────────────
# ServiceAccount
# ──────────────────────────────────────────────────────────────────────────────

serviceAccount:
  create: true
  annotations: {}
  name: "cerebro-hive"

# ──────────────────────────────────────────────────────────────────────────────
# Observability — Prometheus + Grafana
# ──────────────────────────────────────────────────────────────────────────────

prometheus:
  enabled: true
  # kube-prometheus-stack is the recommended operator-based install
  # Set to false to use a standalone Prometheus instead
  useOperator: true
  retention: "15d"
  storageSize: "50Gi"
  # ServiceMonitor selectors — auto-discovers all CerebroHive services
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/part-of: cerebro-hive
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "2Gi" }
  ingress:
    enabled: false   # Internal only — access via kubectl port-forward or Grafana

grafana:
  enabled: true
  adminPassword: ""   # Set via secret: cerebro-hive-secrets key grafana-admin-password
  existingSecret: "cerebro-hive-secrets"
  adminPasswordKey: "grafana-admin-password"
  replicas: 1
  persistence:
    enabled: true
    size: "10Gi"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  ingress:
    enabled: true
    host: grafana.cerebrohive.com
    path: /
  # Pre-provisioned datasources
  datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-operated:9090
      isDefault: true
    - name: Loki
      type: loki
      url: http://loki:3100
  # Pre-provisioned dashboard folders
  dashboards:
    cerebro-hive:
      swarm-overview:    { url: "https://grafana.com/api/dashboards/12345/revisions/1/download" }
      k8s-cluster:       { gnetId: 15661, revision: 1, datasource: Prometheus }
      node-exporter:     { gnetId: 1860,  revision: 37, datasource: Prometheus }
      nextjs-metrics:    { gnetId: 13659, revision: 1, datasource: Prometheus }

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    receivers:
      - name: "null"
      - name: slack-alerts
        slack_configs:
          - channel: "#cerebro-alerts"
            send_resolved: true
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    route:
      group_by: ["alertname", "cluster", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: slack-alerts
      routes:
        - match: { severity: critical }
          receiver: slack-alerts
          repeat_interval: 1h
