title = "CerebroHive gitleaks config"

# Extends gitleaks' built-in default ruleset (API key/token patterns for the
# major providers, private key blocks, etc.) rather than replacing it.
[extend]
useDefault = true

# ── CerebroHive-specific secret patterns ───────────────────────────────────────

[[rules]]
id = "cerebro-anthropic-key"
description = "Anthropic API Key"
regex = '''sk-ant-[A-Za-z0-9_-]{40,}'''
tags = ["secret", "ai", "anthropic"]

[[rules]]
id = "cerebro-openai-key"
description = "OpenAI API Key"
regex = '''sk-[A-Za-z0-9]{48,}'''
tags = ["secret", "ai", "openai"]

[[rules]]
id = "cerebro-google-ai-key"
description = "Google AI / Vertex API Key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
tags = ["secret", "ai", "google"]

[[rules]]
id = "cerebro-jwt-secret"
description = "JWT secret in env assignment"
regex = '''JWT_SECRET\s*=\s*["']?[A-Za-z0-9+/=!@#$%^&*]{32,}["']?'''
tags = ["secret", "jwt"]

[[rules]]
id = "cerebro-database-url"
description = "PostgreSQL connection string with embedded password"
regex = '''postgresql://[^:]+:[^@$\{]+@'''
tags = ["secret", "database"]

# ── Allowlist ──────────────────────────────────────────────────────────────────
[allowlist]
description = "Known-safe patterns that would otherwise false-positive"
regexes = [
  # Placeholder/example values in tracked example files
  '''aos_[A-Za-z0-9_-]{0,10}\.\.\.''',
  # Template variable syntax — not real secrets
  '''\$\{[A-Z_]+\}''',
  '''\$\(\([A-Z_]+\)\)''',
  # Known test fixtures
  '''sk-ant-EXAMPLE''',
  '''sk-EXAMPLE''',
  '''test_password''',
  '''supersecretpassword123''',   # docker-compose dev default
  '''postgresql://(stub:stub|test:test|root:root)@localhost:\d+/[\w_]+''',
]
paths = [
  '''\.codex-task8-verification/''',
  '''\.codex-task8-fix-verification/''',
  '''data/agent-os\.json$''',
  '''apps/platform-api/src/modules/agents/agents\.routes\.test\.ts$''',
  '''apps/twin-studio/modules/industry/domain-vocabulary\.ts$''',
  '''docs/engineering/database\.md$''',
  '''packages/db/prisma\.config\.ts$''',
  '''PRISMA_SETUP_GUIDE\.md$''',
  '''\.planning/codebase/INTEGRATIONS\.md$''',
  '''apps/studio/platform/src/kernel/persistence/migrate\.ts$''',
  '''apps/studio/platform/src/kernel/config/config\.ts$''',
  '''platform/src/kernel/persistence/migrate\.ts$''',
  '''platform/src/kernel/config/config\.ts$''',
  '''infra/k8s/base/external-secrets/external-secrets\.yaml$''',
  '''services/ml-svc/src/main\.cpp$''',
  '''apps/sphere/README\.md$''',
  '''apps/pulse/README\.md$''',
  '''\.github/workflows/openapi-drift\.yml$''',
  '''\.github/workflows/release-train\.yml$''',
  '''\.env\.example$''',
  '''agentos/\.env\.example$''',
  '''node_modules/''',
  '''\.next/''',
  '''dist/''',
  '''\.turbo/''',
  '''__tests__/''',
  '''tests?/fixtures/''',
]
