name: Dependency Review

# Closes the gap recorded in MASTER-PLAN-GAP-ASSESSMENT.md: Dependabot keeps
# existing dependencies fresh, but nothing blocked a pull request that *introduced*
# a new vulnerable or badly-licensed dependency. This runs at review time, on the
# diff, before the dependency is ever merged.

on:
  pull_request:
    branches: [main, develop, "release/*"]

permissions:
  contents: read
  pull-requests: write # post the review summary as a PR comment

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          # Match the container-image gate in docker-build.yml, which fails on
          # CRITICAL/HIGH. Keeping the two thresholds aligned avoids the case
          # where a dependency passes review and then fails the image scan.
          fail-on-severity: high

          # Copyleft licences require a deliberate decision for a commercial,
          # closed-source distribution. Denying them here forces that decision
          # onto the pull request instead of discovering it at release time.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

          comment-summary-in-pr: on-failure
          warn-only: false
