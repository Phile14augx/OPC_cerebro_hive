# CerebroHive — Synthetic Monitoring Probes
# Uses prometheus-operator Probe CRD (preferred) + ServiceMonitor fallback.
# Requires: prometheus-community/prometheus-blackbox-exporter deployed in
#           namespace "monitoring" with Service name "blackbox-exporter".
#
# Secret "blackbox-probe-auth" must exist in the monitoring namespace:
#   kubectl create secret generic blackbox-probe-auth \
#     --from-literal=api-key=<YOUR_PROBE_API_KEY> \
#     --from-literal=workspace-id=<YOUR_PROBE_WORKSPACE_ID> \
#     -n monitoring

---
# ── Probe: Platform API Health ──────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: platform-api-health
  namespace: monitoring
  labels:
    app.kubernetes.io/component: synthetic-monitoring
    cerebro/probe-tier: p1
spec:
  jobName: cerebro-synthetic
  interval: 30s
  module: https_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://api.cerebrohive.com/health
        - https://api.cerebrohive.com/ready
      relabelingConfigs:
        - sourceLabels: [__address__]
          targetLabel: target
        - targetLabel: probe_type
          replacement: liveness
        - targetLabel: service
          replacement: platform-api
  metricRelabelings:
    - sourceLabels: [__name__]
      regex: probe_(success|duration_seconds|http_status_code|ssl_earliest_cert_expiry)
      action: keep

