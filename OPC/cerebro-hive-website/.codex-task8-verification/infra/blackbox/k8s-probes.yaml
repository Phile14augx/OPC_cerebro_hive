# ── Probe: AI Inference Gateway ──────────────────────────────────────────────────
# Uses http_post_inference module — sends a minimal chat completion request
# and validates the response body contains "content", "choices", or "text".
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ai-inference-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/component: synthetic-monitoring
    cerebro/probe-tier: p0
spec:
  jobName: cerebro-synthetic
  interval: 60s
  module: http_post_inference
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://api.cerebrohive.com/api/ai/generate
      relabelingConfigs:
        - sourceLabels: [__address__]
          targetLabel: target
        - targetLabel: probe_type
          replacement: e2e_inference
        - targetLabel: service
          replacement: ai-gateway
        - targetLabel: sla_tier
          replacement: p0

