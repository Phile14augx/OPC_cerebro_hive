---
# ── Probe: TLS Certificate Expiry (all public endpoints) ────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: tls-cert-expiry
  namespace: monitoring
  labels:
    app.kubernetes.io/component: synthetic-monitoring
    cerebro/probe-tier: p1
spec:
  jobName: cerebro-synthetic-tls
  interval: 3600s   # every hour — certs don't change that fast
  module: tls_cert_expiry
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - api.cerebrohive.com:443
        - studio.cerebrohive.com:443
        - auth.cerebrohive.com:443
      relabelingConfigs:
        - sourceLabels: [__address__]
          targetLabel: target
        - targetLabel: probe_type
          replacement: tls_expiry
  metricRelabelings:
    - sourceLabels: [__name__]
      regex: probe_(ssl_earliest_cert_expiry|success|duration_seconds)
      action: keep

---
# ── Alerting Rules for Synthetic Probes ─────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cerebro-synthetic-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/component: synthetic-monitoring
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: cerebro.synthetic.probes
      interval: 30s
      rules:
        # P0: Probe has been down for 1 minute
        - alert: CerebroProbeDown
          expr: |
            probe_success{job="cerebro-synthetic", sla_tier="p0"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
            runbook: "https://wiki.cerebrohive.com/runbooks/probe-down"
          annotations:
            summary: "P0 probe failing: {{ $labels.target }}"
            description: >
              Synthetic probe for {{ $labels.service }} ({{ $labels.target }})
              has been failing for >1 minute. probe_type={{ $labels.probe_type }}.

        # P1: Non-critical probe down
        - alert: CerebroProbeDownP1
          expr: |
            probe_success{job="cerebro-synthetic", sla_tier!="p0"} == 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Probe failing: {{ $labels.target }}"
            description: >
              Synthetic probe for {{ $labels.service }} ({{ $labels.target }})
              has been failing for >5 minutes.

        # Slow: p95 probe duration > SLA
        - alert: CerebroProbeSlowResponse
          expr: |
            probe_duration_seconds{job="cerebro-synthetic", probe_type="e2e_inference"} > 5
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Inference probe slow: {{ $labels.target }}"
            description: >
              AI inference probe is taking {{ $value | humanizeDuration }} to respond
              (threshold: 5s).

        # TLS cert expiring within 14 days
        - alert: CerebroCertExpiringSoon
          expr: |
            (probe_ssl_earliest_cert_expiry{job="cerebro-synthetic-tls"} - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "TLS cert expiring: {{ $labels.target }}"
            description: >
              TLS certificate for {{ $labels.target }} expires in
              {{ $value | humanizeDuration }}. Renew immediately.

        # TLS cert expiring within 7 days
        - alert: CerebroCertExpiringCritical
          expr: |
            (probe_ssl_earliest_cert_expiry{job="cerebro-synthetic-tls"} - time()) / 86400 < 7
          for: 1h
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "TLS cert CRITICAL: {{ $labels.target }}"
            description: >
              TLS certificate for {{ $labels.target }} expires in
              {{ $value | humanizeDuration }}. IMMEDIATE action required.
