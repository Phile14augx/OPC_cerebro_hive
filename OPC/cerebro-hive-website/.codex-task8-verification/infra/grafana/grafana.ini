# Grafana Configuration — CerebroHive
# Deploy via Helm (grafana/grafana chart) — override with values.yaml
# Sensitive values injected from Kubernetes secrets (envFrom: grafana-secrets)

[server]
domain           = grafana.cerebrohive.com
root_url         = https://grafana.cerebrohive.com
serve_from_sub_path = false
enable_gzip      = true

[database]
type     = postgres
host     = ${GF_DATABASE_HOST}
name     = grafana
user     = ${GF_DATABASE_USER}
password = ${GF_DATABASE_PASSWORD}
ssl_mode = require

[session]
provider      = postgres
provider_config = user=${GF_DATABASE_USER} password=${GF_DATABASE_PASSWORD} host=${GF_DATABASE_HOST} dbname=grafana sslmode=require

[security]
admin_user            = ${GF_SECURITY_ADMIN_USER}
admin_password        = ${GF_SECURITY_ADMIN_PASSWORD}
secret_key            = ${GF_SECURITY_SECRET_KEY}
disable_gravatar      = true
cookie_secure         = true
cookie_samesite       = lax
allow_embedding       = false
content_security_policy = true
content_security_policy_template = """script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE_TEMPLATE_PLACEHOLDER;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src * data:;base-uri 'self';connect-src 'self' grafana.com ws://grafana.cerebrohive.com/ wss://grafana.cerebrohive.com/;manifest-src 'self';media-src 'none';form-action 'self';"""

[users]
allow_sign_up   = false
allow_org_create = false
auto_assign_org  = true
auto_assign_org_role = Viewer
default_theme   = dark

[auth]
disable_login_form = false
disable_signout_menu = false
oauth_auto_login   = true
signout_redirect_url = https://auth.cerebrohive.com/logout

[auth.generic_oauth]
enabled       = true
name          = CerebroHive SSO
icon          = signin
client_id     = ${GF_AUTH_OAUTH_CLIENT_ID}
client_secret = ${GF_AUTH_OAUTH_CLIENT_SECRET}
auth_url      = https://auth.cerebrohive.com/oauth2/authorize
token_url     = https://auth.cerebrohive.com/oauth2/token
api_url       = https://auth.cerebrohive.com/oauth2/userinfo
scopes        = openid profile email groups
allowed_domains = cerebrohive.com
role_attribute_path = contains(groups[*], 'grafana-admin') && 'Admin' || contains(groups[*], 'grafana-editor') && 'Editor' || 'Viewer'
allow_assign_grafana_admin = true
use_pkce      = true

[smtp]
enabled    = true
host       = smtp.sendgrid.net:587
user       = apikey
password   = ${GF_SMTP_PASSWORD}
from_address = grafana@cerebrohive.com
from_name  = CerebroHive Grafana

[alerting]
enabled    = false   # Using Grafana Alerting (unified), not legacy

[unified_alerting]
enabled    = true
ha_peers   = grafana:9094

[feature_toggles]
enable = tempoSearch tempoServiceGraph tempoApmTable traceToMetrics publicDashboards

[dashboards]
min_refresh_interval = 5s
versions_to_keep     = 20

[analytics]
reporting_enabled    = false
check_for_updates    = false
check_for_plugin_updates = false

[log]
mode = console
level = info

[metrics]
enabled       = true
interval_seconds = 10
# Prometheus scrapes /metrics on port 3000
