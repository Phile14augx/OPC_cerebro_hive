server:
  port: 8083

spring:
  application:
    name: crm-svc

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/cerebro}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:cerebro}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:cerebro}

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=120s

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

grpc:
  client:
    ml-svc:
      address: ${ML_SVC_ADDR:static://localhost:50051}
      negotiationType: PLAINTEXT

nats:
  url: ${NATS_URL:nats://localhost:4222}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.cerebro: DEBUG
    org.springframework.security: WARN
