[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runner"
version = "0.1.0"
description = "HiveSwarm Agent Runner — hosts Orchestrator, Critic, Coding, and Research agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "anthropic>=0.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runner"]

[tool.hatch.envs.default]
dependencies = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
agent-runner = "agent_runner.main:main"
