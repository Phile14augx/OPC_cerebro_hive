name: DockerOps — Build, Scan & Push Images

# Builds multi-arch Docker images for all services and pushes to GHCR.
# Triggered on push to main (latest tag) and on version tags (vX.Y.Z).
# Uses build matrix so each service is built in parallel.
#
# Security gate (closes the confirmed gap in MASTER-PLAN-GAP-ASSESSMENT.md:
# images were built and pushed with no scanning step at all). Per service,
# before the final multi-arch push:
#   1. Build a single-arch (linux/amd64) scan candidate, loaded locally only
#      (never pushed) — Buildx `--load` doesn't support multi-platform, so
#      the scan always runs against the amd64 variant.
#   2. Generate a CycloneDX SBOM for that candidate (anchore/sbom-action).
#   3. Scan it with Trivy; severity threshold is configurable via the
#      TRIVY_SEVERITY/TRIVY_EXIT_CODE env vars below (default: fail the job
#      on CRITICAL or HIGH). A step failure here stops the job before the
#      push step ever runs — nothing failing the gate reaches GHCR.
#   4. Only then: build (all requested platforms) and push, as before.
# CodeQL (SAST) and Dependabot (dependency freshness) are unchanged and
# complementary — this workflow only covers the image-publishing path.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to build (leave empty for all)"
        required: false
        default: ""
      push:
        description: "Push images to registry"
        type: boolean
        default: true

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false   # Never cancel a push in flight

permissions:
  contents: read
  packages: write
  id-token: write        # OIDC for AWS ECR if needed later
  security-events: write # required to upload Trivy SARIF to code scanning

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cerebro-hive
  # Policy thresholds for the pre-push Trivy gate — change here, not per-step,
  # to keep the policy in one place as it evolves.
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  TRIVY_EXIT_CODE: "1"

jobs:
  # ── Resolve metadata (tag, sha, push flag) ─────────────────────────────────
  meta:
    name: Resolve Build Metadata
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.meta.outputs.version }}
      tags_json:  ${{ steps.meta.outputs.tags }}
      labels_json: ${{ steps.meta.outputs.labels }}
      push:       ${{ steps.push.outputs.push }}
      sha_short:  ${{ steps.sha.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Resolve push flag
        id: push
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "push=${{ inputs.push }}" >> $GITHUB_OUTPUT
          else
            echo "push=true" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta (version + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/placeholder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

  # ── Build matrix ───────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Next.js / Node apps ─────────────────────────────────────────────
          - name: studio
            context: .
            dockerfile: apps/studio/Dockerfile
            image: studio
            platforms: linux/amd64,linux/arm64

          - name: forge
            context: .
            dockerfile: apps/forge/Dockerfile
            image: forge
            platforms: linux/amd64,linux/arm64

          - name: platform-api
            context: .
            dockerfile: apps/platform-api/Dockerfile
            image: platform-api
            platforms: linux/amd64,linux/arm64

          # ── NestJS services ─────────────────────────────────────────────────
          - name: forge-api
            context: .
            dockerfile: services/forge-api/Dockerfile
            image: forge-api
            platforms: linux/amd64,linux/arm64

          # ── AI Gateway (Node) ───────────────────────────────────────────────
          - name: ai-gateway
            context: .
            dockerfile: packages/ai-gateway/Dockerfile
            image: ai-gateway
            platforms: linux/amd64,linux/arm64

          # ── Go services ─────────────────────────────────────────────────────
          - name: swarm-api
            context: services/swarm-api
            dockerfile: services/swarm-api/Dockerfile
            image: swarm-api
            platforms: linux/amd64,linux/arm64

          - name: swarm-runtime
            context: services/swarm-runtime
            dockerfile: services/swarm-runtime/Dockerfile
            image: swarm-runtime
            platforms: linux/amd64,linux/arm64

          - name: memory-service
            context: services/memory-service
            dockerfile: services/memory-service/Dockerfile
            image: memory-service
            platforms: linux/amd64,linux/arm64

          - name: router-service
            context: services/router-service
            dockerfile: services/router-service/Dockerfile
            image: router-service
            platforms: linux/amd64,linux/arm64

          - name: tool-gateway
            context: services/tool-gateway
            dockerfile: services/tool-gateway/Dockerfile
            image: tool-gateway
            platforms: linux/amd64,linux/arm64

          - name: gateway
            context: services/gateway
            dockerfile: services/gateway/Dockerfile
            image: gateway
            platforms: linux/amd64,linux/arm64

          # ── Python services ─────────────────────────────────────────────────
          - name: agent-runner
            context: services/agent-runner
            dockerfile: services/agent-runner/Dockerfile
            image: agent-runner
            platforms: linux/amd64,linux/arm64

          - name: planner-service
            context: services/planner-service
            dockerfile: services/planner-service/Dockerfile
            image: planner-service
            platforms: linux/amd64,linux/arm64

          - name: evaluation-service
            context: services/evaluation-service
            dockerfile: services/evaluation-service/Dockerfile
            image: evaluation-service
            platforms: linux/amd64,linux/arm64

          - name: learning-service
            context: services/learning-service
            dockerfile: services/learning-service/Dockerfile
            image: learning-service
            platforms: linux/amd64,linux/arm64

          # ── JVM services ─────────────────────────────────────────────────────
          - name: academy-svc
            context: services/academy-svc
            dockerfile: services/academy-svc/Dockerfile
            image: academy-svc
            platforms: linux/amd64,linux/arm64

          - name: crm-svc
            context: services/crm-svc
            dockerfile: services/crm-svc/Dockerfile
            image: crm-svc
            platforms: linux/amd64,linux/arm64

          - name: platform-svc
            context: services/platform-svc
            dockerfile: services/platform-svc/Dockerfile
            image: platform-svc
            platforms: linux/amd64,linux/arm64

          # ── ML service (C++) ─────────────────────────────────────────────────
          - name: ml-svc
            context: services/ml-svc
            dockerfile: services/ml-svc/Dockerfile
            image: ml-svc
            platforms: linux/amd64   # arm64 cross-compile for C++ is complex

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Log in to GHCR
        if: needs.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=CerebroHive ${{ matrix.name }}
            org.opencontainers.image.vendor=CerebroHive
            com.cerebrohive.service=${{ matrix.name }}

      # ── Security gate: build a local scan candidate first ──────────────────
      # linux/amd64 only, regardless of matrix.platforms — Buildx --load
      # cannot load a multi-platform build into the local Docker daemon, and
      # a local, unpushed image is exactly what SBOM/Trivy need to inspect.
      - name: Build scan candidate (local, amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: scan-candidate/${{ matrix.name }}:${{ needs.meta.outputs.sha_short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            GIT_SHA=${{ needs.meta.outputs.sha_short }}
            GIT_REF=${{ github.ref_name }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: scan-candidate/${{ matrix.name }}:${{ needs.meta.outputs.sha_short }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          retention-days: 90

      - name: Scan image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-candidate/${{ matrix.name }}:${{ needs.meta.outputs.sha_short }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          ignore-unfixed: true # don't block on vulns with no available fix yet

      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.sarif
          retention-days: 90
      # If the Trivy step above failed (severity threshold exceeded), the job
      # stops here by default — the steps below never run, so nothing that
      # fails the gate reaches GHCR.

      - name: Build and push ${{ matrix.name }} (multi-arch, post-scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ needs.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_SHA=${{ needs.meta.outputs.sha_short }}
            GIT_REF=${{ github.ref_name }}

      - name: Capture image digest
        id: digest
        if: needs.meta.outputs.push == 'true'
        run: |
          # The build-push action outputs the digest; capture it for Cosign
          echo "Image built and pushed — signing with Cosign next"

      # ── Cosign keyless signing (OIDC) ──────────────────────────────────────
      # Signs each pushed image using Sigstore/Cosign with GitHub OIDC identity
      # (no long-lived keys needed). The signature is stored in the registry
      # alongside the image and can be verified with:
      #   cosign verify ghcr.io/ORG/cerebro-hive/NAME:TAG \
      #     --certificate-identity-regexp "https://github.com/ORG/.*" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Install Cosign
        if: needs.meta.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign image with Cosign (keyless OIDC)
        if: needs.meta.outputs.push == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign each tag produced by docker-meta
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Signing: $tag"
              cosign sign --yes "$tag"
            fi
          done <<< "$IMAGE_TAGS"

      - name: Attest SBOM to image (Cosign)
        if: needs.meta.outputs.push == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
          PRIMARY_TAG: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ needs.meta.outputs.sha_short }}
        run: |
          if [ -f "sbom-${{ matrix.name }}.cdx.json" ]; then
            echo "Attesting SBOM to $PRIMARY_TAG"
            cosign attest --yes \
              --predicate "sbom-${{ matrix.name }}.cdx.json" \
              --type cyclonedx \
              "$PRIMARY_TAG"
          else
            echo "No SBOM file found — skipping attestation"
          fi

      - name: Image digest
        run: echo "✅ ${{ matrix.name }} → built, scanned, pushed, signed, SBOM attested"

  # ── Summary ────────────────────────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [meta, build]
    if: always()
    steps:
      - name: Summarize
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ needs.meta.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pushed | ${{ needs.meta.outputs.push }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build result | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
