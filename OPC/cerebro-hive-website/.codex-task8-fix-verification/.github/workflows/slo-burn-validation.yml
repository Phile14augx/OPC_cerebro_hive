name: SLO Burn Validation

# Validates that the SLO alerting pipeline fires correctly under real
# latency injection. Produces evidence for CEC (Control Evidence Coverage).
#
# This is a P1 break test — runs monthly and on manual dispatch.
# Evidence from runs is recorded in GitHub Actions job summaries and
# posted to the #sre-evidence Slack channel.

on:
  # Monthly on the first Sunday at 03:00 UTC (off-peak, after weekly chaos)
  schedule:
    - cron: "0 3 1-7 * 0"

  workflow_dispatch:
    inputs:
      latency_ms:
        description: "Latency to inject (ms). Default: 600. SLO threshold: 500ms."
        type: string
        default: "600"
      alert_wait_seconds:
        description: "Max seconds to wait for alert to fire. Default: 300."
        type: string
        default: "300"

concurrency:
  group: slo-burn-validation
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  CLUSTER_NAME: cerebro-staging
  AWS_REGION: us-east-1
  CHAOS_NAMESPACE: cerebro-chaos

jobs:
  validate:
    name: SLO burn detection validation
    runs-on: ubuntu-latest
    environment: chaos-staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CHAOS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      # ── Record baseline SLO state ────────────────────────────────────────
      - name: Record pre-experiment SLO baseline
        id: baseline
        run: |
          PROMETHEUS="http://prometheus-operated.monitoring.svc.cluster.local:9090"

          # Use kubectl exec to reach in-cluster Prometheus
          BURN_RATE=$(kubectl exec -n monitoring deploy/prometheus-kube-prometheus-prometheus -- \
            wget -qO- "${PROMETHEUS}/api/v1/query?query=cerebro:slo:latency:burn_rate_1h" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('data',{}).get('result',[]); print(r[0]['value'][1] if r else '0')" 2>/dev/null || echo "0")

          AVAILABILITY=$(kubectl exec -n monitoring deploy/prometheus-kube-prometheus-prometheus -- \
            wget -qO- "${PROMETHEUS}/api/v1/query?query=cerebro:slo:availability:rate30d" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('data',{}).get('result',[]); print(r[0]['value'][1] if r else '1')" 2>/dev/null || echo "1")

          echo "baseline_burn_rate=${BURN_RATE}" >> $GITHUB_OUTPUT
          echo "baseline_availability=${AVAILABILITY}" >> $GITHUB_OUTPUT

          echo "## SLO Baseline (Pre-Experiment)" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Latency burn rate (1h) | ${BURN_RATE}× |" >> $GITHUB_STEP_SUMMARY
          echo "| Availability (30d) | ${AVAILABILITY} |" >> $GITHUB_STEP_SUMMARY

      # ── Inject latency ───────────────────────────────────────────────────
      - name: Apply latency chaos experiment
        run: |
          LATENCY_MS="${{ github.event.inputs.latency_ms || '600' }}"

          # Patch the latency value into the experiment
          sed "s/\"600ms\"/\"${LATENCY_MS}ms\"/" \
            infra/chaos/stage4-network/slo-burn-validation.yaml \
            | kubectl apply -f -

          echo "✅ Latency chaos applied: ${LATENCY_MS}ms injection active"

      # ── Wait for alert to fire ───────────────────────────────────────────
      - name: Wait for CerebroSLOErrorBudgetCritical to fire
        id: alert_check
        run: |
          MAX_WAIT="${{ github.event.inputs.alert_wait_seconds || '300' }}"
          POLL=30
          elapsed=0
          alert_fired_at=""

          while [ $elapsed -lt $MAX_WAIT ]; do
            ALERT_FIRING=$(kubectl exec -n monitoring deploy/alertmanager -- \
              wget -qO- 'http://localhost:9093/api/v2/alerts?filter=alertname=CerebroSLOErrorBudgetCritical' \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "0")

            BURN_RATE=$(kubectl exec -n monitoring deploy/prometheus-kube-prometheus-prometheus -- \
              wget -qO- 'http://localhost:9090/api/v1/query?query=cerebro:slo:latency:burn_rate_1h' \
              | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('data',{}).get('result',[]); print(float(r[0]['value'][1]) if r else 0)" 2>/dev/null || echo "0")

            echo "[${elapsed}s] burn_rate=${BURN_RATE}× | alert_firing=${ALERT_FIRING}"

            if [ "$ALERT_FIRING" -gt "0" ]; then
              alert_fired_at=$elapsed
              break
            fi

            sleep $POLL
            elapsed=$((elapsed + POLL))
          done

          if [ -n "$alert_fired_at" ]; then
            echo "alert_fired=true" >> $GITHUB_OUTPUT
            echo "fired_at_seconds=${alert_fired_at}" >> $GITHUB_OUTPUT
            echo "final_burn_rate=${BURN_RATE}" >> $GITHUB_OUTPUT
          else
            echo "alert_fired=false" >> $GITHUB_OUTPUT
            echo "fired_at_seconds=timeout" >> $GITHUB_OUTPUT
            echo "final_burn_rate=${BURN_RATE}" >> $GITHUB_OUTPUT
          fi

      # ── Remove latency injection ─────────────────────────────────────────
      - name: Remove chaos experiment
        if: always()
        run: |
          kubectl delete -f infra/chaos/stage4-network/slo-burn-validation.yaml \
            --ignore-not-found || true
          echo "✅ Chaos experiment removed"

      # ── Verify alert resolves ────────────────────────────────────────────
      - name: Wait for alert to resolve
        if: steps.alert_check.outputs.alert_fired == 'true'
        run: |
          echo "Waiting for CerebroSLOErrorBudgetCritical to resolve (max 10 min)..."
          for i in $(seq 1 20); do
            sleep 30
            STILL_FIRING=$(kubectl exec -n monitoring deploy/alertmanager -- \
              wget -qO- 'http://localhost:9093/api/v2/alerts?filter=alertname=CerebroSLOErrorBudgetCritical' \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "1")

            if [ "$STILL_FIRING" = "0" ]; then
              echo "✅ Alert resolved after $((i * 30))s"
              exit 0
            fi
            echo "[${i}] Alert still firing..."
          done
          echo "⚠️ Alert did not resolve within 10 minutes — may need manual investigation"

      # ── Write evidence summary ───────────────────────────────────────────
      - name: Write evidence summary
        if: always()
        run: |
          FIRED="${{ steps.alert_check.outputs.alert_fired }}"
          FIRED_AT="${{ steps.alert_check.outputs.fired_at_seconds }}"
          BURN_RATE="${{ steps.alert_check.outputs.final_burn_rate }}"
          LATENCY_MS="${{ github.event.inputs.latency_ms || '600' }}"
          RUN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## SLO Burn Validation Results — ${RUN_DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Injected latency | ${LATENCY_MS}ms |" >> $GITHUB_STEP_SUMMARY
          echo "| SLO threshold | 500ms p99 |" >> $GITHUB_STEP_SUMMARY
          echo "| Alert fired | ${FIRED} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time to fire | ${FIRED_AT}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Peak burn rate | ${BURN_RATE}× |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY

          if [ "$FIRED" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **PASS** — SLO alerting pipeline is functioning correctly." >> $GITHUB_STEP_SUMMARY
            echo "The alert fired ${FIRED_AT}s after latency injection began." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **FAIL** — Alert did not fire within the observation window." >> $GITHUB_STEP_SUMMARY
            echo "Investigate: recording rules, Alertmanager routing, or burn rate thresholds." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post to Slack evidence channel
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_EVIDENCE_WEBHOOK }}
        run: |
          FIRED="${{ steps.alert_check.outputs.alert_fired }}"
          EMOJI="✅"
          [ "$FIRED" != "true" ] && EMOJI="❌"

          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"${EMOJI} SLO Burn Validation: alert_fired=${FIRED}\",
              \"blocks\": [{
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*SLO Burn Validation Evidence*\nAlert fired: \`${FIRED}\` | Time to fire: \`${{ steps.alert_check.outputs.fired_at_seconds }}s\` | Peak burn: \`${{ steps.alert_check.outputs.final_burn_rate }}×\`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"
                }
              }]
            }"

      - name: Fail job if alert did not fire
        if: steps.alert_check.outputs.alert_fired != 'true'
        run: |
          echo "❌ FAIL: SLO burn alert did not fire within the observation window."
          echo "This means either:"
          echo "  1. The latency injection did not produce enough traffic to exceed the threshold"
          echo "  2. The recording rules are not producing data"
          echo "  3. The Alertmanager routing is not delivering the alert"
          echo "  4. The burn rate threshold is set too high"
          exit 1
