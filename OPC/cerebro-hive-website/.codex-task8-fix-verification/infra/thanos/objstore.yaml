# Thanos Object Store Configuration — S3 (AWS)
# Store this as a Kubernetes Secret:
#
#   kubectl create secret generic thanos-objstore \
#     --from-file=objstore.yaml=infra/thanos/objstore.yaml \
#     -n monitoring
#
# For IRSA (recommended): remove access_key / secret_key and attach
# the IAM role to the service account instead.

type: S3
config:
  bucket: cerebrohive-thanos-metrics
  endpoint: s3.us-east-1.amazonaws.com
  region: us-east-1

  # IRSA (IAM Roles for Service Accounts) — preferred; no static credentials
  # Attach role: arn:aws:iam::<account>:role/thanos-metrics-rw
  # to the "thanos" ServiceAccount in the monitoring namespace.
  # Leave access_key and secret_key blank when using IRSA.
  access_key: ""
  secret_key: ""

  # SSE-S3 server-side encryption
  sse_config:
    type: SSE-S3

  # Multipart upload threshold and part size
  part_size: 134217728   # 128 MiB

  # HTTP client config
  http_config:
    idle_conn_timeout: 90s
    response_header_timeout: 2m
    insecure_skip_verify: false
    tls_handshake_timeout: 10s
