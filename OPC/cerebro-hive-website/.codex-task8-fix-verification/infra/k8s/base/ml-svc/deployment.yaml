apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-svc
  namespace: cerebro-hive
  labels:
    app.kubernetes.io/name: ml-svc
    app.kubernetes.io/component: ml-compute
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-svc
        app.kubernetes.io/component: ml-compute
    spec:
      serviceAccountName: ml-svc
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Prefer nodes with AVX2 (SIMD for Eigen)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: [c5.2xlarge, c5.4xlarge, c5n.2xlarge]
      containers:
        - name: ml-svc
          image: cerebrohive/ml-svc:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cerebro-secrets
                  key: database-url
            - name: GRPC_ADDR
              value: "0.0.0.0:50051"
            - name: LOG_LEVEL
              value: info
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc_health_probe
                - -addr=:50051
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc_health_probe
                - -addr=:50051
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ml-svc
  namespace: cerebro-hive
  labels:
    app.kubernetes.io/name: ml-svc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ml-svc
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-svc
  namespace: cerebro-hive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # Lower threshold — CPU-intensive work
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600  # Slow scale-down — warm caches
