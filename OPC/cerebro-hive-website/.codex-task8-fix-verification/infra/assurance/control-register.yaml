    evidence_key: slo_burn_alert
    cec_weight: 2
    last_run: ~
    last_status: UNKNOWN
    last_sha: ~
    last_artifact: ~

  - id: DR-1
    name: PostgreSQL Restore Verification
    domain: reliability
    description: >
      Nightly restore from S3 basebackup into disposable namespace. Smoke tests:
      table count, row counts, write test, index health, checksum. RTO ≤ 30 min.
    target: Continuous
    automation: .github/workflows/restore-verification.yml
    evidence_key: pg_restore
    cec_weight: 3
    last_run: ~
    last_status: UNKNOWN
    last_sha: ~
    last_artifact: ~

  - id: DR-2
    name: MinIO Restore Verification
    domain: reliability
    description: >
      Nightly restore from S3 replica. Smoke tests: bucket presence, object
      counts, CRUD round-trip. RTO ≤ 15 min.
    target: Continuous
    automation: .github/workflows/restore-verification.yml
    evidence_key: minio_restore
    cec_weight: 2
    last_run: ~
    last_status: UNKNOWN
    last_sha: ~
    last_artifact: ~

  - id: DR-3
    name: NATS JetStream Restore Verification
    domain: reliability
    description: >
      Nightly restore from snapshot. Smoke tests: JetStream status, stream
      presence, pub/sub round-trip, persist+replay. RTO ≤ 20 min.
    target: Continuous
    automation: .github/workflows/restore-verification.yml
    evidence_key: nats_restore
    cec_weight: 2
    last_run: ~
    last_status: UNKNOWN
    last_sha: ~
    last_artifact: ~

  - id: CHAOS-1
    name: Workload Fault Injection
    domain: reliability
    description: >
      Stage 1-5 Chaos Mesh experiments: pod kills, node stress, disk fill,
      network latency/partition/DNS failure, AI provider faults. Weekly schedule.
    target: Continuous
    automation: .github/workflows/chaos.yml
    evidence_key: chaos_experiments
    cec_weight: 2
    last_run: ~
    last_status: UNKNOWN
    last_sha: ~
    last_artifact: ~

  - id: PRF-1
    name: G1 Overhead Benchmark (gVisor vs runc)
    domain: performance
    description: >
      Quarterly benchmark: 5 tests (syscall, I/O, fork, memory, CPU).
      gVisor overhead must be < 3× runc for all tests.
    target: Continuous
    automation: .github/workflows/g1-overhead-benchmark.yml
    evidence_key: g1_benchmark
    cec_weight: 1
    last_run: ~
    last_status: UNKNOWN
    last_sha: ~
    last_artifact: ~

  # ── Compliance controls ───────────────────────────────────────────────────
  - id: PRR-1
    name: Production Readiness Review
    domain: compliance
    description: >
      11 subsystems evaluated against 7 questions each (restore, rotate,
      upgrade, backup, recover, observe, audit). Score: 70.8%.
    target: Automated
    automation: docs/production-readiness-review.md
    evidence_key: prr_score
    cec_weight: 2
    last_run: ~
    last_status: UNKNOWN
    last_sha: ~
    last_artifact: ~

# ── CEC calculation ──────────────────────────────────────────────────────────
# CEC = (controls with last_status=PASS * cec_weight) /
#        (total controls * max_weight) * 100
#
# Target: ≥ 90%
# Current (seed): UNKNOWN for all — will be updated on first evidence chain run

metadata:
  schema_version: "1.0"
  cec_target_pct: 90
  total_controls: 18
  domains:
    - security
    - supply-chain
    - reliability
    - performance
    - compliance
