[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-service"
version = "0.1.0"
description = "HiveSwarm Learning Service — replay storage, benchmarking, and prompt optimisation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "structlog>=24.1.0",
    "dspy-ai>=2.4.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/learner"]

[tool.ruff]
line-length = 100
target-version = "py311"
