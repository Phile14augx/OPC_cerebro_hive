spring:
  application:
    name: platform-svc
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/cerebrohive_db}
    username: ${POSTGRES_USER:cerebrohive}
    password: ${POSTGRES_PASSWORD:supersecretpassword123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:cerebro-hive}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:cerebro-hive}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s
  data:
    redis:
      url: ${REDIS_URL:redis://:redispassword123@localhost:6379}

server:
  port: ${PORT:3001}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

grpc:
  client:
    ml-svc:
      address: ${ML_SVC_GRPC_URL:static://ml-svc:50051}
      negotiation-type: plaintext

nats:
  url: ${NATS_URL:nats://nats:4222}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
